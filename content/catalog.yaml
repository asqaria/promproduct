      <p>Перед резкой смазывают минеральным маслом резьбу ручки, оси, нож и очищенный участок трубы. Трубу зажимают между ножом и роликами со средним усилием так, чтобы остался след глубиной 0,1–0,2 мм, и делают полный оборот, следя, чтобы конец следа совпал с началом. Затем постепенно поджимают нож ручкой и вращают труборез до полного отрезания — для трубы 3/4" это примерно 12…15 оборотов. Если след пошёл винтовой линией, новый рез начинают чуть в стороне. Нож допускает неоднократную переточку до диаметра 24 мм с симметричной кромкой и углом при вершине 60 градусов.</p>
