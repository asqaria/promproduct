      <p>СГ-20Н — гидравлический съёмник с выносным насосом для демонтажа подшипников, зубчатых колёс, ступиц, шкивов и других деталей, установленных на вал с натягом. По сравнению с СГ-10Н он развивает вдвое большее осевое усилие — 20 т — и рассчитан на более крупные детали: диаметр захвата от 100 до 350 мм, глубина захвата до 280 мм. Для деталей диаметром меньше 100 мм эта модель не подходит.</p>
      <h3>Как устроен</h3>
      <p>Основу съёмника составляют гидроцилиндр с регулировочной резьбой и основание с проушинами, к которому серьгами крепятся лапы. Съёмник можно использовать с тремя лапами или, если три захвата установить невозможно, с двумя, закреплёнными на диаметрально противоположных проушинах. Центрирующий конус на штоке входит в центровочное отверстие вала и не даёт съёмнику уйти с оси. Масло подаётся выносным ручным насосом НРГ 700-0.7 по рукаву высокого давления длиной 1,8 м, рабочее давление — 630 бар.</p>
      <p>Ход штока составляет 70 мм; если деталь не сошла за один ход, шток возвращают пружиной, открыв перепускной винт, и переустанавливают съёмник. Съёмник эксплуатируют при температуре от -5 до +45 °C на масле ВМГЗ, И-12А или аналогах.</p>
      <p>Комплект с насосом поставляется в деревянном ящике. Поставляем СГ-20Н по Казахстану — добавьте его в запрос, и мы подготовим коммерческое предложение.</p>
