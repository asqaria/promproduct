    short_description: Стационарные ручные гидравлические тросорезы со встроенным насосом для стальных тросов и кабелей диаметром до 30 и до 48 мм.
    description: |
      <p>Стационарные ручные гидравлические тросорезы ТСРГ-30 и ТСРГ-48 со встроенным насосом предназначены для резки стальных тросов, медных и алюминиевых кабелей. ТСРГ-30 режет тросы и кабели диаметром до 30 мм, ТСРГ-48 — до 48 мм. В отличие от переносных тросорезов, эти модели устанавливаются на литое основание и рассчитаны на крупные сечения.</p>
      <h3>Как устроен</h3>
      <p>На литом основании закреплены гидроцилиндр со встроенным ручным насосом и откидная скоба с неподвижными С-образными ножами. Скобу откидывают, укладывают в неё трос, поднимают обратно и фиксируют замком на верхней силовой раме. После этого заворачивают перепускной винт и телескопической рукояткой нагнетают масло в гидроцилиндр: подвижный нож на штоке проходит между двумя неподвижными ножами и перерезает трос. Поворот винта против часовой стрелки открывает клапан сброса давления, и шток возвращается пружиной.</p>
      <table><thead><tr><th>Параметр</th><th>ТСРГ-30</th><th>ТСРГ-48</th></tr></thead><tbody><tr><td>Осевое усилие, т</td><td>14</td><td>20</td></tr><tr><td>Диаметр троса или кабеля, мм</td><td>до 30</td><td>до 48</td></tr><tr><td>Ход штока, мм</td><td>35</td><td>53</td></tr><tr><td>Толщина подвижного лезвия, мм</td><td>5</td><td>8</td></tr><tr><td>Качков на полное выдвижение штока</td><td>80</td><td>60</td></tr><tr><td>Масса в упаковке, кг</td><td>16.2</td><td>32.1</td></tr><tr><td>Фанерный ящик, мм</td><td>415×140×215</td><td>535×185×260</td></tr></tbody></table>
      <p>Тросорезы работают при температуре от -10 до +45 °С на масле ВМГЗ, И-12, И-20 или аналогах; если шток стал выдвигаться медленнее за качок, масло заменяют на морозостойкое. Поставляем ТСРГ-30 и ТСРГ-48 по Казахстану — добавьте модель в запрос.</p>
