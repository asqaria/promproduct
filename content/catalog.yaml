      <p>Тиски трубные настольные ТТ-3 предназначены для зажима труб при их обработке в цеховых условиях. Они удерживают трубы диаметром от 12 до 90 мм и выполнены из закалённой конструкционной стали. При крутящем моменте на рукоятке винта 1,5 кгс·м тиски создают усилие зажима 750 кгс, а масса инструмента составляет всего 5 кг.</p>
      <h3>Как устроен</h3>
      <p>Основание тисков имеет по бокам лапки с пазами шириной 18 мм — через них тиски крепятся к рабочему столу двумя болтами. В основании закреплены губки, образующие призму под трубу. Сверху на основание устанавливается откидная скоба: одним концом она соединена с основанием неподвижной осью, другим — вставной осью со штырём. Вставная ось привязана к основанию тросиком, поэтому не теряется при переноске. В резьбовом отверстии скобы перемещается винт с ручкой, который опускает прижим с призматической губкой; ход прижима — 85 мм.</p>
      <p>Чтобы установить трубу, вывинчивают винт, вынимают вставную ось и откидывают скобу. Трубу укладывают на губки, возвращают скобу на место, фиксируют осью и затягивают винт. Такая схема позволяет укладывать трубу сверху, а не продевать её сквозь тиски.</p>
