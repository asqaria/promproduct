    450 мм 6 мм Модель Усилие гидроцилиндра Максимальная ширина шины Максимальная толщина шины Размеры Вес Шинорезы с внешним
    насосом ШРГ-150Н 20т 150 мм 10 мм 280х150х430 34 кг ШРГ-200Н 35т 200 мм 10 мм 325х155х430 38 кг ШРГ-150Н-V 20т 150 мм
    10 мм 280х150х430 26 кг ШРГ-200Н-V 35т 200 мм 10 мм 325х155х430 31 кг 1. НАЗНАЧЕНИЕ ШИНОРЕЗА ШРГ Гидравлический шинорез
    ШРГ состоит из сварного основания, неподвижного нижнего ножа, гидроцилиндра с закрепленным на штоке подвижным верхним
    ножом. На нижнем ноже шинореза установлен упор с регулировочным винтом для настройки толщины отрезаемой шины. Гидроцилиндр
    одностороннего действия с пружинным возвратом штока может работать совместно с гидравлическим насосом с давлением до 700
    бар. С шинорезом возможно использовать ручной гидравлический насос или маслостанцию с педалью. Важно: Шинорез поставляется
    без гидравлического насоса! В качестве привода шинореза можно использовать любой ручной гидравлический насос с давлением
    до 700 бар (70 МПа) или электрические маслостанции одинарного действия с ручным или электромагнитным управлением. 2. ТЕХНИЧЕСКИЕ
    ХАРАКТЕРИСТИКИ ШИНОРЕЗОВ Шинорез гидравлический ШРГ-150Н с выносным насосом 1. Усилие гидроцилиндра: 20 т 2. Максимальная
    ширина шины: 150 мм 3. Максимальная толщина шины: 10 мм 4. Возврат штока: пружинный 5. Рабочее давление: 630 бар 6. Вес
    в упаковке: 33.5 кг 7. Размеры основания: 280мм х 150мм 8. Габаритные размеры (ДхШхВ): 280мм х 150мм х 430мм 9. Толщина
    подвижного лезвия: 17.5 мм 10. Толщина неподвижного лезвия: 18.1 мм 11. Максимальный просвет между стойками: 160 мм 12.
    Размеры сечения упора: 25мм х 25мм 13. Используемое масло: И-8А, И-12А, И-20А, ВМГЗ 14. Резьба подключения насоса: коническая
    3/8" Шинорез гидравлический ШРГ-200Н с выносным насосом 1. Усилие гидроцилиндра: 35 т 2. Максимальная ширина шины: 200
    мм 3. Максимальная толщина шины: 10 мм 4. Возврат штока: пружинный 5. Рабочее давление: 630 бар 6. Вес в упаковке: 37.8
    кг 7. Размеры основания: 325мм х 155мм 8. Габаритные размеры (ДхШхВ): 325мм х 155мм х 430мм 9. Толщина подвижного лезвия:
    17.5 мм 10. Толщина неподвижного лезвия: 18.5 мм 11. Максимальный просвет между стойками: 210 мм 12. Размеры сечения упора:
    25мм х 25мм 13. Используемое масло: И-8А, И-12А, И-20А, ВМГЗ 14. Резьба подключения насоса: коническая 3/8" 3. ПРИНЦИП
    РАБОТЫ Подключите рукав высокого давления с БРС к шинорезу и к маслостанции / гидравлическому насосу. Если ответная часть
    БРС на шинорезе не соответствует БРС на рукаве высокого давления ручного насоса или маслостанции, то потребуется ее заменить.
    Если маслостанция используемая с шинорезом имеет рабочее давление более 700 бар, то необходимо понизить предельное давление
    станции. Проверьте работу шинореза на холостом ходу, затем сбросьте давление в системе. После возврата штока разместите
    шину в рабочем пространстве максимально близко к оси гидроцилиндра и отрегулируйте винт упора по вертикали так, чтобы
    отрезаемая шина находилась горизонтально. Произведите рез шины , сбросьте давление в системе. Подвижный нож под действием
    пружины вернется в исходное верхнее положение. 4. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА Поставщик гарантирует надежную работу шинореза
    в течение 12 месяцев со дня его продажи при условии соблюдения потребителем правил эксплуатации, изложенных в настоящем
    РЭ. Претензии принимаются только при наличии настоящего руководства по эксплуатации, а также с отметкой о дате продажи
    и штампом организации-продавца. Гарантийные обязательства не распространяются на оборудование с механическими повреждениями,
    вызванными неправильной эксплуатацией и при наличии следов самостоятельных ремонтных работ. Гидравлический шинорез ШРГ-450Н-V'
