  source_text: 'Наше предприятие производит гидравлические трубогибы ТПГ, ТГ с ручным и электрическим приводом, опрессовочные
    насосы ОГС и другой трубомонтажный инструмент. Трубогиб ручной гидравлический ИНСТАН ТПГ-2Б Стоимость трубогиба указана
    в Прайс-листе. 1. НАЗНАЧЕНИЕ Трубогиб гидравлический переносной предназначен для гибки водо-газопроводных труб по ГОСТ
    3262-75, а также проката круглого сечения, прочностные характеристики которого не превышают характеристик трубы 2" (условный
    проход 50мм). 2. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ Параметр Значение 2.1. Наибольшее усилие гидроцилиндра, Тс 10 2.2. Наибольший
    ход штока, мм 180 2.3. Усилие на ручке при максимальной нагрузке, кГс 40 2.4. Габаритные размеры транспортировочного ящика
    B×H×L, мм 205×275×680 2.5. Параметры гибочных шаблонов, dтр/R гибки, дюйм/мм 3/8"/50, 1/2"/65, 3/4"/80, 1"/100, 1.25"/135,
    1.5"/150, 2"/200 2.6. Масса, кг 54 3. КОМПЛЕКТНОСТЬ Позиция Кол-во 3.1. Гидроцилиндр в сборе 1 3.2. Траверса 2 3.3. Вращающиеся
    упоры 2 3.4. Гибочные шаблоны (комплектация до 2") 7 3.4. Гибочные шаблоны (комплектация до 1.5") 6 3.5. Ящик транспортировочный
    1 3.6. Втулка переходная 1 3.7. Руководство по эксплуатации 1 Стоимость комплектующих трубогиба указана в Прайс-листе.
    4. УСТРОЙСТВО ГИДРАВЛИЧЕСКОГО ТРУБОГИБА 4.1. Трубогиб состоит из гидроцилиндра 1, траверс верхней 2 и нижней 3 и двух
    упоров 4 (рис. 1). 4.2. Гидроцилиндр 1 является силовым устройством трубогиба. На заднем корпусе 6 размещены нагнетательное
    устройство 7 с рукояткой 8 и винт 9 перепускного клапана. На торце заднего корпуса 6 закреплен масляный бачок 13 с пробкой
    — "сапун" 11 с отверстием для подсоса и выхода воздуха. Передний корпус 10 имеет "карманы" для установки траверс 2 и 3.
    Выдвижной шток 12 обеспечивает гибочное усилие 10Тс. Возврат штока обеспечивает пружина. На переднем корпусе установлен
    крючок 14 для фиксации рукоятки 8 при переносе гидроцилиндра. 4.3. Траверсы верхняя 2 и нижняя 3 — сварная конструкция
    с отверстиями для упоров 4. Нижняя траверса 3 имеет ножки 17. 4.4. Упор 4 состоит из поворотной оси 15, в направляющих
    которой установлен ползун 16 с цилиндрическим ручьем. Планки 18 ограничивают перемещение ползуна. Цапфы 19 осей 15 устанавливаются
    в отверстия траверс. 4.5. Гибочные шаблоны 5 — стальное точное литье. Шаблоны 3/8"…1,25" унифицированы. Для труб свыше
    1,25" используется переходная втулка. В ручье шаблонов 1,5"…2" выполнено обнижение для снижения сплющивания и гофрообразования.
    4.6. Металлический транспортировочный ящик с полимерным покрытием предназначен для упаковки при хранении и транспортировке.
    Трубогиб гидравлический ТПГ-2Б ИНСТАН 5. ПОДГОТОВКА ТРУБОГИБА К РАБОТЕ Соберите трубогиб согласно схеме на рисунке 1,
    обратив внимание на положение траверс 2 и 3 и упоров 4. Установите на шток 12 гибочный шаблон 5 соответствующий диаметру
    изгибаемой трубы. Смажьте цапфы 19 и направляющие упоров 4 консистентной смазкой. Ручей ползуна 16 оставляйте несмазанным.
    Установите упоры 4 в отверстия траверс 2 и 3 на одинаковом расстоянии относительно оси гидроцилиндра. Ползуны 16 выставьте
    симметрично относительно поворотной оси так, чтобы они имели одинаковый свободный ход. Проверьте уровень масла в бачке.
    Если ниже нормы — долейте (см. п.7.1). Заверните винт 9 перепускного клапана до упора. Рукояткой 8 выдвиньте шток 12 в
    крайнее переднее положение. Если при усилии 30–40 кГс шток не выдвигается — усилие достаточное. Отверните винт 9 на 0,5–1
    оборот для возврата штока. Скорость возврата регулируйте винтом 9. Повторите пункт 7. 6. РАБОТА 6.1. Установите изгибаемую
    трубу между гибочным шаблоном 5 и упорами 4. 6.2. Перемещением штока 12 зажмите трубу между упорами 4 и гибочным шаблоном
    5 и начинайте гибку. Первый этап гибки — вдавливание трубы в ручей шаблона. Упоры сдвигаются на 1–2 отверстия к центру.
    После вдавливания упоры возвращаются на штатную позицию и выполняется окончательная гибка. 6.3. При гибке ползуны 16 скользят
    вместе с трубой по направляющим осей 15, что повышает качество и снижает усилие на рукоятке на 15–20%. Следите, чтобы
    зазор между планками 18 и осью был не менее 2мм. 6.4. После гибки отведите шток, отвернув винт 9 на 0,5–1 оборот. Скорость
    возврата регулируйте винтом 9. 6.5. После возврата штока заверните винт 9 до упора, чтобы избежать попадания воздуха при
    транспортировке. 6.6. При гибке тонкостенных труб (отношение толщины стенки к диаметру менее 0,06) используйте плотную
    набивку сухим песком. 6.7. Для труб большего диаметра применяйте мягкую алюминиевую/медную пластину между трубой и шаблоном.
    7. ОБСЛУЖИВАНИЕ ГИДРАВЛИЧЕСКОГО ТРУБОГИБА 7.1. Своевременно доливайте масло в бачок, чтобы исключить засос воздуха. Доливка
    масла: — выньте пробку 11; — долейте масло "Индустриальное 12А" или "Индустриальное 20А" ГОСТ 20799-75 до уровня 3–5мм
    от нижней кромки заливного отверстия; — вставьте пробку. Надежная работа обеспечивается при температуре помещения от +12°С
    и выше. При температуре ниже +12°С замените масло на морозостойкое той же вязкости. 7.2. Удаление воздуха из полости нагнетательного
    устройства 7: — заверните винт 9 до упора; — выньте ось 20; — отсоедините рукоятку 8; — выньте плунжер 21 с рубашкой 22
    из втулки 23; — залейте масло до верхней кромки; — вставьте плунжер до упора (шток 12 выдвинется примерно на 4–6мм); —
    соедините осью 20; — сделайте 20–30 "качков" (шток выдвинется на 20–30мм). 7.3. Удаление воздуха из штоковой плоскости:
    — после п.7.2 выдвиньте шток до упора, поставьте гидроцилиндр штоком вниз и закройте пальцем отверстие в пробке 11; —
    откройте винт 9 на 0,5–1 оборот и контролируйте возврат. Когда остается 120–150мм — закрутите винт 9, переведите цилиндр
    горизонтально, затем аккуратно выпустите воздух. Для лучшего результата нажмите свободной рукой на бачок 13 сверху-вниз.
    Не допускайте попадания грязи, песка, ржавчины и др. частиц на шток гидроцилиндра. Не заливайте отработанное масло. 8.
    ВОЗМОЖНЫЕ НЕИСПРАВНОСТИ И СПОСОБЫ ИХ УСТРАНЕНИЯ Неисправность Возможная причина Способы устранения Отсутствие перемещения
    штока. Открыт перепускной клапан. Заверните винт 9 до упора. Воздух в нагнетательном устройстве. Удалите воздух как указано
    в п.7.2. Посторонние частицы во всасывающем клапане или смещение шарика в седле клапана. Устраняется «гидравлическим ударом»:
    — заверните винт 9 до упора; — поднимите рукоятку 8 в крайнее верхнее положение; — резко опустите рукоятку 8 вниз ударом
    по концу рукоятки. При необходимости повторить. Возвратно-поступательное движение штока в такт движениям рукоятки. Посторонние
    частицы в нагнетательном клапане или смещение шарика в седле обратного клапана. Шток начинает перемещаться после 2-х или
    более «качков» рукоятки. Наличие воздуха в штоковой полости. Удалить воздух как указано в п.7.3. Пружинящее сопротивление
    рукоятки, шток не развивает полного усилия. Воздух в гидросистеме. Удалить воздух по п.7.2 и п.7.3. Подробное описание
    неисправностей гидроцилиндров и способы их устранения. *Указанные в таблице неисправности не являются поводом для предъявления
    претензий к фирме-изготовителю и устраняются собственными силами без применения специального инструмента и оборудования.
    Если указанные методы устранения неисправностей не дают результата, необходимо обратиться в специализированную службу
    ремонта или на фирму изготовитель. 9. МЕРЫ БЕЗОПАСНОСТИ 9.1. Запрещается разбирать трубогиб, находящийся под нагрузкой.
    9.2. Запрещается находиться во время гибки со стороны выхода штока 12. 9.3. Запрещается работать на трубогибе при деформированных
    несущих деталях. 10. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА 10.1. Предприятие гарантирует исправность трубогиба в течение 12 месяцев
    со дня его продажи при условии соблюдения потребителем правил эксплуатации. 10.2. Претензии принимаются только при наличии
    руководства по эксплуатации с заводским номером гидроцилиндра, отметкой о дате продажи и штампом организации-продавца.
    10.3. Гарантийные обязательства не распространяются на: — естественный износ резинотехнических изделий; — механические
    повреждения из-за перегрузки и неправильной эксплуатации; — следы самостоятельных ремонтных работ.'
