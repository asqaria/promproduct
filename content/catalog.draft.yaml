  source_text: 'Наше предприятие производит гидравлические трубогибы ТПГ, ТГ с ручным и электрическим приводом, опрессовочные
    насосы ОГС и другой трубомонтажный инструмент. Электрический опрессовщик ОГС-25ЭП-3 Электрический опрессовщик ОГС-25ЭП-3
    предназначен для точной проверки давления и герметичности систем трубопроводов , отопительных систем и различных сосудов
    высокого давления. Электрические опрессовщики Давление опрессовки Расход Опрессовщик ОГС-16ЭП-6 16 бар 6 л/мин Опрессовщик
    ОГС-25ЭП-3 25 бар 3 л/мин Опрессовщик ОГС-60ЭП-3 60 бар 3 л/мин Опрессовщик ОГС-60ЭП-6 60 бар 6 л/мин Опрессовщик ОГС-60ЭП-9
    60 бар 9 л/мин Опрессовщик ОГС-100ЭП-3 100 бар 3 л/мин Опрессовщик ОГС-60ЭП-10 60 бар 10 л/мин Опрессовщик ОГС-80ЭП-18
    80 бар 18 л/мин Опрессовщик ОГС-100ЭП-40 100 бар 40 л/мин Опрессовщик Rothenberger RP PRO 3 40 бар 6 л/мин Опрессовщик
    Rems E-Push 60 бар 7 л/мин Технические характеристики электроопрессовщика ОГС-25ЭП-3: Диапазон испытаний: 0 – 25 бар,
    деление шкалы 1 бар 0 – 350 psi, деление шкалы 20 psi 0 – 2.5 MPa, деление шкалы 0,1 MPa Производительность: 2,9 л / мин
    Подсоединение к системе: R 1/2" (наружная) Мощность: 150 Вт Сетевое напряжение: 220-240 В / 50 Гц 1. НАЗНАЧЕНИЕ И ОСОБЕННОСТИ
    КОНСТРУКЦИИ ЭЛЕКТРООПРЕССОВЩИКА ОГС-25ЭП-3: Опрессовочный насос с электроприводом для опрессовки гидравлических систем
    модели ОГС-25ЭП (далее " опрессовщик ") предназначен для опрессовки различных емкостей и систем трубопроводов при работе
    в условиях умеренного климата, исполнение У, категория I по ГОСТ 15150-69 в интервале температур окружающей среды от 10
    до 35 град. Его конструкция обеспечивает надежную работу в течение продолжительного времени, т.к. все детали его гидравлической
    системы изготовлены из нержавеющих материалов, а обратные клапаны всасывающей и нагнетательной систем защищены конструктивно
    от грязи при всасывании и сливе рабочей жидкости. Постоянное рабочее давление в испытываемой системе обеспечивается обратным
    нагнетательным клапаном, регулируемым вентилем 17, и запорным вентилем 19 на сливе. 2. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ ЭЛЕКТРИЧЕСКОГО
    ОПРЕССОВЩИКА 2.1 Максимальное давление МПа (кГс/см^2) 2,5 (25) 2.2 Производительность, л/мин 2,9 2.3 Габаритные размеры
    LxBxH, мм 400х200х300 2.4 Масса опрессовщика, кг 10 2.5 Технические характеристики электропривода: Номинальная мощность,
    Вт 150 Напряжение, В/Гц 220..240 / 50 2.6 Водоснабжение Чистая питьевая вода, макс.температура 40 град 2.7 Размеры шланга
    высокого давления: Длина, мм 2000 Присоединительный к испытываемой системе, дюймы 1/2", наружный 3. КОМПЛЕКТНОСТЬ ОПРЕССОВЩИКА
    ОГС-25ЭП 3.1 Насос опрессовочный, шт 1 3.4 Рукав высокого давления, шт 1 3.7 Руководство по эксплуатации, брошюра 1 4.
    УСТРОЙСТВО ОПРЕССОВЩИКА ОГС-25ЭП 4.1. Насос с электроприводом для опрессовки гидравлических систем (далее "опрессовщик")
    состоит из электродвигателя 1 с пультом управления 2, плунжерного насоса 3 с приводным механизмом закрытым кожухом 4 и
    распределительного устройства 5. 4.2. Элекродвигатель 1 опрессовщика имеет основание 6 закрепленное на баке. На корпусе
    электродвигателя установлен пульт управления 2 с тумблером 8 для включения и выключения насоса и сигнальной лампочкой
    9 для информации оператора о подключении опрессовщика к сети питания. К пульту управления опрессовщика подведен кабель
    10 со штекером 11 для подключения в сеть электропитания с заземлением. На фланце электродвигателя закреплены плунжерный
    насос 3 с распределительным устройством 5 и ручка 12 для переноса электрического опрессовщика . На выходном конце вала
    электродвигателя установлена эксцентриковая втулка с шариковым подшипником, которая служит приводным механизмом для плунжерного
    насоса 3. Приводной механизм и плунжерный насос 3 закрыты кожухом 4. 4.3. Распределительное устройство 5 включает в себя:
    - Систему для забора воды из водопроводной сети или из бака; - Систему для подачи воды под высоким давлением в испытываемую
    систему. 4.4. Система для забора воды включает в себя корпус 13 с обратным клапаном и приемным штуцером 14 с наружной
    резьбой 1/2". К приемному штуцеру подсоединяется подводной шланг с фильтром. 4.5. Система для подачи воды под высоким
    давлением включает в себя нагнетательный клапан с вентилем 17 для регулировки давления, манометр 18, вентиль 19 для слива
    воды и штуцер 20 с наружной резьбой для присоединения шланга высокого давления 21. 5. ПОДГОТОВКА ОПРЕССОВЩИКА К РАБОТЕ
    5.1. Перед подключением опрессовщика к водопроводной сети тщательно проверьте состояние шланга высокого давления 21 и
    кабеля 10 со штекером 11. Розетка в сети электропитания должна иметь заземление. 5.2. Проверьте состояние водяного фильтра,
    если забор воды производится из бака, при необходимости почистите. 5.3. Закройте вентиль 19. 5.4. Вставьте штекер 11 в
    розетку сети электропитания с соблюдением ПУЭ и ПТБ. Должна загореться сигнальная лампочка 9. 5.5. Включите опрессовочный
    насос тумблером 8. Вода поступает из шланга высокого давления 21 в бак. 5.6. Откройте вентиль 19. Вода начинает поступать
    в бак из сливного патрубка. 5.7. Выключите насос тумблером 8, убедившись в работоспособности опрессовщика. 5.8. Закройте
    вентиль 19. 5.9. Подсоедините выходной конец шланга высокого давления к испытываемой гидравлической системе . 6. РАБОТА
    ОПРЕССОВОЧНОГО НАСОСА С ЭЛЕКТРОПРИВОДОМ 6.1. Включите опрессовщик тумблером 8. 6.2. Вентилем 17 отрегулируйте давление
    необходимое для испытания гидравлической системы . 6.3. После доведения давления до требуемого уровня выключите опрессовочный
    насос тумблером 8. 6.4. После проведения испытаний вентилем слива 19 сбросьте давление в испытанной гидросистеме. 6.5.
    Отключите опрессовщик от сети электропитания. 6.6. Отсоедините шланг высокого давления 21 от испытанной системы. 6.7.
    Отсоедините шланг 21 от электроопрессовщика. 6.8. Слейте воду из бака опрессовщика. 6.9. Перед хранением необходимо удалить
    воду из всех систем опрессовщика, включив его в холостом режиме на несколько секунд. 7. ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ ОПРЕССОВОЧНОГО
    НАСОСА ОГС-25ЭП 7.1. Не допускайте загрязнения опрессовочного насоса и рабочей жидкости. 7.2. Используйте для работы только
    чистую питьевую воду или гидравлическое масло "Индустриальное И-12А" или "Индустриальное-20А". 7.3. Периодически проверяйте
    и очищайте фильтр на заборном шланге опрессовщика . 7.4. После работы с водой ОБЯЗАТЕЛЬНО удалите воду из гидросистемы
    опрессовочного насоса, прокачав его в холостом режиме несколько секунд при открытых вентилях 17 и 19. 7.5. При длительном
    хранении и, особенно при хранении в помещении с отрицательной температурой ОБЯЗАТЕЛЬНО прокачивайте гидравлическую систему
    опрессовочного насоса индустриальным маслом И-12А или И-20А: 7.6. НЕ ДОПУСКАЕТСЯ: работать с водой при температуре ниже
    0 град.; оставлять опрессовочный насос с водой при температуре ниже 0 град. 8. ВОЗМОЖНЫЕ НЕИСПРАВНОСТИ И СПОСОБЫ ИХ УСТРАНЕНИЯ
    Неисправность Возможные причины Способ устранения 1 2 3 8.1.1. Насос не работает. Сигнальная лампа не включена. 8.2.1.
    Не подается электропитание на пульт управления. 8.3.1. Проверьте подключение штекера в штекерную розетку, целостность
    сетевого кабеля 10, наличие напряжения в сети электропитания. 8.1.2. Сигнальная лампа включена, но насос не работает.
    8.2.2. Ток поступает на пульт управления, но напряжение слабое. 8.3.2. Подключить опрессовщик к стабилизатору напряжения
    220В, 50Гц. 8.1.3. Насос заклинило или насос забит льдом. 8.3.3. Обратитесь в сервисный центр. 8.1.4. Насос работает,
    однако вода подается без необходимого давления. 8.2.3. Недостаточное количество воды подается в насос. 8.3.4. Проверьте
    подводящий шланг для воды. Его внутренний диаметр должен быть минимум 12 мм. Вода должна подаваться из крана под давлением
    минимум 1 кг/см^2. 8.2.4. Вместе с водой в гидравлическую систему насоса попало большое количество воздуха. 8.3.5. Поместите
    накопительный бак 24 под краном водопровода и заполните его водой. Опустите заборный шланг 15 в бак с водой. Бак поместите
    на одном уровне с опрессовщиком. 8.2.5. Водный фильтр засорился. 8.3.6. Очистить фильтр. 8.2.6. Вентиль 17 находится в
    положении соответствующем минимальному давлению 8.3.7. Открыть вентиль 17, чтобы достичь требуемого давления. 8.2.7. Прокладки
    изношены, вентили не закрываются полностью. 8.3.8. Обратитесь в сервисный центр. 8.1.5. Непостоянное давление на выходе
    и сильный шум. 8.2.8. В устройство попал воздух. 8.3.9. Проверьте заборный шланг для воды и плотность соединения его с
    обоих концов. 8.2.9. Насос подает недостаточное количество воды. 8.1.6. Насос создает требуемое давление, но не поддерживает
    его. 8.2.10. Клапан вентиля давления 17 функционирует неправильно. 8.3.10. Проверьте клапан, удалите грязь, которая могла
    попасть в клапан. 9. ТЕХНИКА БЕЗОПАСНОСТИ ПРИ РАБОТЕ С ОПРЕССОВЩИКОМ 9.1. Внимательно изучите настоящее руководство по
    эксплуатации опрессовщика и следуйте ему при работе и обслуживании. 9.2. Храните данное руководство по эксплуатации в
    доступном месте. 9.3. К работе с опрессовщиком допускаются лица, знающие правила эксплуатации оборудования с высоким давлением,
    изучившие настоящее руководство по эксплуатации и прошедшие инструктаж по технике безопасности. 9.4. Следите за надежным
    креплением элементов насоса и исправностью напорной линии. 9.5. Проверяйте и периодически очищайте фильтр опрессовочного
    насоса . 9.6. Не производите ремонт опрессовщика и испытываемой гидравлической системы, находящихся под давлением. 9.7.
    Не работайте опрессовщиком с неисправным манометром , контролируйте давление в гидравлической системе и не поднимайте
    его выше уровня, указанного в руководстве по эксплуатации. 9.8. При подключении опрессовщика в сеть электропитания удостоверьтесь,
    что сеть элекропитания имеет ЗАЗЕМЛЕНИЕ. 9.9. Отсоединяйте опрессовщик от сети электропитания после проведения испытаний,
    а так же: перед перемещением опрессовщика с одного места на другое; перед выполнением любых ремонтных работ на опрессовщике
    или испытываемой гидросистеме; перед проверкой или заменой деталей. 9.10. Запрещается перемещать опрессовщик за электрокабель
    или рукав высокого давления. 9.11. Запрещается отсоединять опрессовщик от сети электропитания за электрокабель. 9.12.
    Запрещается использовать опрессовщик, если повреждены: электрокабель; рукав высокого давления ; другие детали. 9.13. Запрещается
    пользоваться неспециализированным удлинителем. 10. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА 10.1. Предприятие гарантирует исправность
    опрессовщика в течение 12 месяцев со дня его продажи. 10.2. Претензии принимаются только при наличии настоящего РЭ с отметкой
    о дате продажи и штампом организации, продавшей опрессовщик. 10.3. Гарантийные обязательства не распространяются на: естественный
    износ резинотехнических изделий. изделия с механическими повреждениями, вызванными перегрузкой и неправильной эксплуатацией.
    изделия со следами самостоятельных ремонтных работ.'
