  source_text: 1. НАЗНАЧЕНИЕ ТРУБОГИБА ТЭМ-76х50 Трубогиб трехвалковый ТЭМ-76х50 с электроприводом предназначен для изготовления
    колец, спиралей, дуг из круглых труб и прямоугольного профиля путем проката между роликами. В стоимость трубогиба включен
    полный комплект роликов для круглых и профильных труб. 2. КОМПЛЕКТНОСТЬ И ХАРАКТЕРИСТИКИ ТРУБОГИБА Наименование, модель
    Трубогиб трехвалковый ТЭМ-76х50 с электроприводом Параметры гибочных роликов (для круглой трубы / прутка) 16мм, 19мм,
    22мм, 25мм, 32мм, 38мм, 51мм, 63мм, 76мм Параметры гибочных роликов (для прямоугольного профиля / прутка / полосы) 16мм,
    19мм, 22мм, 25мм, 30мм, 38мм, 40мм, 50мм Угол гиба трубы, град 0..360 (кольцо, спираль) Толщина стенки трубы 0.5-2мм Усилие
    прижимного винта 7 тонн Количество приводных валов, шт. 2 Мощность электродвигателя 1100 Вт Напряжение питания, В 220
    или 380 Габаритные размеры ящика, мм (длина х ширина х высота) 730х630х1030 Масса трубогиба с комплектом роликов, кг 250
    3. УСТРОЙСТВО ТРУБОГИБА ТЭМ-76х50 и ПРИНЦИП РАБОТЫ Трубогиб состоит из сварной стальной рамы 1, на которой закреплены
    электродвигатель 2, соединенный с редуктором 4 посредством ременной передачи 3. Редуктор 4 передает вращающий момент на
    два приводных вала 6 с помощью цепных передач 9. С помощью приводных валов 6 и поджимающего холостого вала 12 осуществляется
    гибка труб большего диаметра. Трубы меньшего диаметра гнуться с помощью приводных валов 13 и поджимающего холостого вала
    12 с противоположной стороны трубогиба. Вращение на приводные валы 13 передается от валов 6 посредством зубчатых передач
    14. Приводные валы 6 и 13 установлены на радиально-упорные шарикоподшипники закрепленные в корпусах 15. Поджимающий холостой
    вал 12 установлен в подвижном корпусе 16, который при помощи винта 8 перемещается по направляющему основанию 7. Сменные
    гибочные ролики 5 устанавливаются на валы. На приводных валах 6 ролики 5 фиксируются гайками 17, а на холостом валу 12
    не фиксируются. Включение и изменение направления вращения двигателя осуществляется переключателем 10 закрепленном в верхней
    части рамы трубогиба 1. К переключателю 10 подведен электрокабель с штепсельной вилкой. 4. ПОДГОТОВКА ТРУБОГИБА К РАБОТЕ
    4.1. Перед работой проверьте детали трубогиба на наличие повреждений. При обнаружении деформаций, трещин и признаков сильного
    износа на деталях использование трубогиба запрещено. 4.2. Установите переключатель 10 в среднее положение. 4.3. Подключите
    кабель 11 с электрическим разъемом к сети электропитания с соблюдением ПУЭ и ПТБ. 4.4. Установите гибочные ролики 5 требуемого
    размера на валы 6 и 12 или 13 и 12. Закрепите ролики 5 на приводных валах с помощью гаек 17. 4.5. Произведите пробный
    пуск без нагрузки повернув переключатель 10 влево или вправо. 4.6. Выключите двигатель установив переключатель 10 в среднее
    положение. 5. РАБОТА НА ТРУБОГИБЕ 5.1. С помощью винта 8 установите холостой вал 12 в верхнее положение. 5.2. Поместите
    изгибаемую трубу между приводными валами 6 и холостым валом 12 с надетыми на них роликами. 5.3. С помощью винта 8 подожмите
    холостым валом 12 изгибаемую трубу на несколько миллиметров (величина зависит от материала, толщины стенки и диаметра
    трубы). 5.4. Совершите прокатку трубы в обоих направлениях. Для этого поверните переключатель профилегиба 10 влево или
    вправо. 5.5. Повторяйте действия указанные в пунктах 5.3 и 5.4 до придания трубе необходимого изгиба. 5.6. Для гибки серии
    труб небольшого диаметра за один рабочий ход допускается оставлять винт 8 в заранее настроенном положении и помещать трубу
    подогнутым концом между роликами. 6. ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ ТРУБОГИБА ТЭМ-76х50 6.1. Ежедневно производить осмотр рабочих
    органов машины на предмет их исправности. После каждой рабочей смены очищать поверхности рабочих роликов . 6.2. Еженедельно
    контролировать состояние зубчатых венцов шестеренных передач, в случае необходимости принять меры к восстановлению. 6.3.
    Еженедельно, а в случае необходимости чаще, смазывать шестерни зубчатых передач 14 консистентной смазкой. 6.4. Замену
    масла в редукторе главного привода осуществлять каждые 2000 часов работы, но не реже одного раза в три года . 7. ТЕХНИКА
    БЕЗОПАСНОСТИ 7.1. К работе с машиной допускается обученный и проинструктированный персонал. 7.2. Запрещается прикасаться
    к передаточным механизмам во время работы трубогиба . 7.3. Защитная одежда и инструменты, использующиеся при работах с
    машиной, должны соответствовать выполняемым работам. 7.4. Перед запуском машины проверить крепление гибочных роликов .
    Запрещается использовать гибочные ролики с забоинами или трещинами. 8. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА 8.1. Поставщик гарантирует
    надежную работу трубогиба в течение 12 месяцев со дня его продажи при условии соблюдения потребителем правил эксплуатации,
    изложенных в настоящем РЭ . 8.2. Претензии принимаются только при наличии настоящего руководства по эксплуатации, а также
    с отметкой о дате продажи и штампом организации-продавца. 8.3. Гарантийные обязательства не распространяются на оборудование
    с механическими повреждениями, при наличии следов самостоятельных ремонтных работ.
