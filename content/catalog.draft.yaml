  source_text: Наше предприятие производит гидравлические трубогибы ТПГ, ТГ с ручным и электрическим приводом, опрессовочные
    насосы ОГС и другой трубомонтажный инструмент. Трубогиб гидравлический ручной ТПГ-1,25Б ОПИСАНИЕ И ХАРАКТЕРИСТИКИ 1. НАЗНАЧЕНИЕ
    Трубогиб гидравлический ручной предназначен для гибки водо-газопроводных труб по ГОСТ 3262-75, а также проката круглого
    сечения, прочностные характеристики которого не превышают характеристик трубы 1,25" (условный проход 32мм). 2. ТЕХНИЧЕСКИЕ
    ХАРАКТЕРИСТИКИ Параметр Значение 2.1. Наибольшее усилие гидроцилиндра, Тс 7 2.2. Наибольший ход штока, мм 125 2.3. Усилие
    на ручке при максимальной нагрузке, кГс 30 2.4. Габаритные размеры транспортировочного ящика B×H×L, мм 135×225×495 2.5.
    Параметры гибочных шаблонов, dтр/R гибки, дюйм/мм 3/8"/50, 1/2"/65, 3/4"/80, 1"/100, 1.25"/135 2.6. Масса, кг 22 2.7.
    Используемое масло отфильтрованное всесезонное гидравлическое "ВМГЗ" 3. КОМПЛЕКТНОСТЬ Позиция Кол-во 3.1. Гидроцилиндр
    в сборе 1 3.2. Траверсы гибочные 2 3.3. Вращающиеся упоры 2 3.4. Гибочные шаблоны 5 3.5. Ящик транспортировочный 1 3.6.
    Руководство по эксплуатации 1 Трубогиб гидравлический ТПГ-1,25Б без верхней гибочной рамы 5. ПОДГОТОВКА ТРУБОГИБА К РАБОТЕ
    Схема трубогиба ТПГ-1,25Б Трубогиб гидравлический ТПГ-1,25Б 8. ВОЗМОЖНЫЕ НЕИСПРАВНОСТИ И СПОСОБЫ ИХ УСТРАНЕНИЯ Неисправность
    Возможная причина Способы устранения Подробное описание неисправностей гидроцилиндров и способы их устранения. Трубогиб
    ТПГ-1,25Б
