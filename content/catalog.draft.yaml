  images:
  - file: tr-25u/1.webp
    alt: Трубогиб ручной ТР-25У для тонкостенных труб 10мм, 12мм, 14мм, 16мм, 19мм, 22мм, 25мм
  source_text: '1. НАЗНАЧЕНИЕ РУЧНОГО ТРУБОГИБА ТР-25У Ручной рычажный трубогиб ТР-25У предназначен для гибки тонкостенных
    труб круглого профиля из стали, нержавеющей стали, меди и алюминия. 2. КОМПЛЕКТНОСТЬ ТРУБОГИБА ТР-25У 2.1. Основание с
    осью, шт 1 2.2. Корпус-рычаг, шт 1 2.3. Гибочные ролики на 10мм, 12мм, 14мм, 16мм, 19мм, 22мм, 25мм , шт 7 2.4. Гибочные
    сегменты на 10мм, 12мм, 14мм, 16мм, 19мм, 22мм, 25мм , шт 7 2.5. Ось ролика, шт 1 2.6. Гайка, шт 1 2.7. Руководство по
    эксплуатации, шт 1 3. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ РУЧНОГО ТРУБОГИБА 3.1. Размеры изгибаемых труб круглого профиля, Диаметр/R
    гиба, мм 10/40; 12/48; 14/56; 16/64; 19/76; 22/88; 25/100 3.2. Толщина стенки трубы до 2 мм 3.3. Максимальный угол изгиба
    180 градусов 3.4. Габаритные размеры кейса (длина, ширина, высота), мм 640х170х420 3.5. Масса трубогиба в кейсе, кг 27,8
    4. УСТРОЙСТВО ТРУБОГИБА 4.1. Ручной роликовый трубогиб состоит из основания 1 с осью 2, поворотного рычага 3 с рукояткой
    4 и гибочных шаблонов 5. 4.2. Основание 1 имеет литой корпус прямоугольной формы с четырьмя отверстиями для крепления
    болтовым соединением на верстаке. В центральном отверстии корпуса зафиксирована ось 2, на которую устанавливаются гибочный
    шаблон 5 и поворотный рычаг 3. 4.3. Поворотный рычаг 3 состоит из литого корпуса 6 с пазом, в котором установлен ползун
    7 с возможностью перемещения и фиксации в определенном месте. В ползуне 7 устанавливается ролик 8, соответствующий размерам
    изгибаемой трубы. Ролик 8 имеет возможность свободного вращения на оси 9, которая фиксируется от поворота в пазу корпуса
    6 рычага 3. Фиксация ползуна 7 с роликом 8 осуществляется гайкой 10. Ползун 7 соединен с винтом 11, который перемещается
    вместе с ползуном 7 при вращении гайки 12, установленной в корпусе 6 рычага 3. Поворот рычага 3 осуществляется за стержень
    13, на который надевается рукоятка 4. Стержень 13 зафиксирован в корпусе рычага трубогиба 3, а в отверстии стержня расположен
    винт 11. 4.4. Конструкция и размеры гибочных шаблонов 5 обеспечивают качественную гибку тонкостенных труб . Маркировка
    на гибочных шаблонах указывает на наружный диаметр изгибаемой трубы в мм и дюймах. Важно: Параметры отечественных водо-газопроводных
    труб в дюймах не соответствуют данной маркировке, поэтому гибка водо-газопроводных труб данным трубогибом запрещается,
    т. к. может привести к повреждению деталей трубогиба. Каждый гибочный шаблон снабжен индивидуальным упором 14, соответствующим
    размерам изгибаемой трубы. Упор крепится на шаблоне винтом и удерживает изгибаемую трубу от перемещения при гибке. 5.
    ПОДГОТОВКА ТРУБОГИБА К РАБОТЕ 5.1. Закрепите основание трубогиба 1 с осью 2 на прочной и устойчивой поверхности верстака
    с помощью болтовых соединений (не входят в комплект поставки) через четыре отверстия в основании 1. 5.2. Соберите трубогиб
    согласно схеме на рис. 2, предварительно смазав машинным маслом ось 2. Гибочный шаблон трубогиба 5 и ролик 8 должны соответствовать
    размеру изгибаемой трубы. 5.3. Вращением гайки 12 отведите ролик 8 от гибочного шаблона 5 на расстояние достаточное для
    установки изгибаемой трубы. 5.4. Нанесите немного машинного масла на желоб в ролике 8 и гибочном шаблоне 5, а также в
    зазор между роликом 8 осью 9. Это обеспечит плавную работу трубогиба. 5.5. Установите изгибаемую трубу в отверстие упора
    14 в соответствии с размерами указанными на чертеже изгибаемой трубы. 5.6. Вращением гайки 12 подведите ролик 8 до касания
    с трубой, обеспечив надежное обжатие ее без деформации. 5.7. Зафиксируйте ползун 7 с роликом 8 на корпус 6 рычага 3 гайкой
    10. Невыполнение данной операции приведет к поломке при гибке гайки 12, которая изготовлена из пластмассы. 6. РАБОТА 6.1.
    ВНИМАНИЕ! Перед началом гибки трубы обязательно выполните п. 5.7. настоящего руководства по эксплуатации. 6.2. Поворотом
    рычага 3 за рукоятку 4 вручную производите гибку трубы на требуемый угол. 6.3. После выполнения работ по гибке трубы,
    ослабьте гайку 10 и вращением гайки 12 отведите от трубы ползун 7 с роликом 8 на расстояние достаточное для извлечения
    трубы. 6.4. Аккуратно извлеките трубу из отверстия упора 14. 7. ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ ТРУБОГИБА 7.1. Содержите трубогиб
    и рабочее место в чистоте. Не допускайте накапливание на трубогибе и его деталях пыли и грязи. 7.2. Следите за состоянием
    узлов и деталей трубогиба и заменяйте изношенные детали по мере необходимости. 7.3. Рабочие поверхности гибочных шаблонов
    5, роликов 8, осей 2 и 9 должны быть чистыми и слегка смазанными машинным маслом. 7.4. Перед транспортировкой на другой
    объект или при хранении трубогиб необходимо разобрать, очистить от грязи и пыли и уложить все его детали в кейс. Хранить
    трубогиб необходимо в теплом сухом помещении, а при длительном хранении необходимо неокрашенные металлические поверхности
    смазать консервирующей смазкой. 8. МЕРЫ БЕЗОПАСНОСТИ 8.1. Запрещается эксплуатировать трубогиб без надежного его закрепления
    на прочной и устойчивой рабочей поверхности верстака с помощью болтовых соединений (в комплект поставки не входят). 8.2.
    Обеспечьте надежность сборки трубогиба . 8.3. Внимательно ознакомьтесь с конструкцией трубогиба, техническими параметрами
    и настоящим руководством по эксплуатации. 8.4. Запрещается изменять конструкцию трубогиба , а также удлинять рычаг 3 с
    помощью дополнительных приспособлений (труб, прутков и т.д.), не входящих в комплект поставки. 8.5. Контролируйте исправность
    и состояние всех деталей трубогиба. Любая неисправная деталь должна немедленно ремонтироваться или заменяться. 8.6. Используйте
    только комплектующие, входящие в комплект поставки трубогиба , т.к. применение несоответствующих комплектующих может стать
    причиной несчастного случая или поломки трубогиба. 8.7. В рабочей зоне трубогиба (между роликом 8 и гибочным шаблоном
    5) не должны находиться мусор, стружка и другие посторонние предметы. Не допускается накапливания пыли, грязи на деталях
    трубогиба, а так же на поверхности и внутри изгибаемой трубы. 8.8. Используйте дополнительные опоры при гибке длинных
    труб. Будьте особенно внимательными при гибке длинных и очень коротких труб. 8.9. Не допускайте попадания рук в рабочую
    зону между роликом 8 и гибочным шаблоном 5. 8.10. Исключите при работе соскальзывание руки с рукоятки 4 трубогиба. Рукоятка
    трубогиба должна быть сухой, без наличия на ней следов смазки. 8.11. Запрещается работать с трубогибом , если вы принимали
    лекарство или находитесь в состоянии алкогольного или наркотического опьянения. 9. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА 9.1. Поставщик
    гарантирует надежную работу ручного трубогиба в течение 12 месяцев со дня его продажи, при условии соблюдения потребителем
    правил эксплуатации, изложенных в настоящем руководстве. 9.2. Претензии принимаются при наличии настоящего руководства
    по эксплуатации с отметкой о дате продажи и штампом организации-продавца. 9.3. Гарантийные обязательства не распространяются
    на оборудование с механическими повреждениями, при наличии следов самостоятельных ремонтных работ.'
