  source_text: 'https://www.instan.spb.ru/images/products-superbig/pipebender-tpg2ep.jpg Трубогиб электрический гидравлический
    ТПГ-2ЭП 1. НАЗНАЧЕНИЕ ТРУБОГИБА Трубогиб гидравлический переносной предназначен для гибки водо-газопроводных труб по ГОСТ
    3262-75, а также проката круглого сечения, прочностные характеристики которого не превышают характеристик трубы 2" (условный
    проход 50мм). 2. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ 2.1. Наибольшее усилие гидроцилиндра, Тс..........10 2.2. Наибольший ход штока,
    мм...............................180 2.3. Производительность, мм/мин............................450 2.4. Габаритные размеры
    транспортировочного ящика трубогиба BхHхL, мм.................205х275х680 2.5. Габаритные размеры транспортировочного
    ящика насосной станции BхHхL, мм.....320х480х500 2.6. Параметры гибочных шаблонов, dтр/R гибки, дюйм/мм...............................................3/8"/50,
    1/2"/65, 3/4"/80, 1"/100, 1.25"/135, 1.5"/150, 2"/200 2.7. Количество гибочных шаблонов (в комплектации): - С раздельными
    гибочными шаблонами, шт.......................................7 - С комбинированным и раздельными гибочными шаблонами,
    шт.....4 2.8. Масса трубогиба, кг.........................................................................50 2.9. Масса
    насосной станции, кг...........................................................30 3. КОМПЛЕКТНОСТЬ ТРУБОГИБА 3.1. Гидроцилиндр
    в сборе, шт 1 3.2. Траверса верхняя, шт 1 3.3. Траверса нижняя, шт 1 3.4. Упоры, шт 2 3.5. Гибочные шаблоны: 3.5.1. С
    раздельными гибочными шаблонами, шт 7 3.5.2. С комбинированным и раздельными гибочными шаблонами, шт 5 3.6. Ящик транспортировочный
    для трубогиба, шт 1 3.7. Гидравлическая маслостанция, шт 1 3.8. Ящик транспортировочный для насосной станции, шт 1 3.9.
    Втулка переходная, шт 1 3.10. Руководство по эксплуатации трубогиба, шт 1 3.11. Руководство по эксплуатации гидравлической
    насосной станции, шт 1 https://www.nasos-mgs.ru/product/maslostancii-mgs-700-08p-e-1.html 4. УСТРОЙСТВО ГИДРАВЛИЧЕСКОГО
    ТРУБОГИБА 4.1. Трубогиб состоит из гидроцилиндра 1, траверс верхней 2 и нижней 3, двух упоров 4, комплекта гибочных шаблонов
    5 и гидравлической насосной станции 6 с рукавом высокого давления 7 с быстроразъёмным соединением БРС на выходе (рис.1).
    4.2. Гидроцилиндр 1 является силовым устройством трубогиба. На торце заднего корпуса 8 гидроцилиндра 1 имеется штуцер
    9 с быстроразъёмным соединением БРС, через которое гидроцилиндр 1 соединяется с рукавом высокого давления 7 гидростанции
    6. Передний корпус 10 гидроцилиндра в верхней и нижней части имеет "карманы" для установки в них траверс 2 и 3. Выдвижной
    шток 11 гидроцилиндра обеспечивает рабочее гибочное усилие 10Тс. Возврат штока в исходное положение обеспечивается пружиной,
    установленной в гидроцилиндре. 4.3. Траверсы верхняя 2 и нижняя 3 выполнены в виде сварной конструкции, на поперечных
    планках которых имеются отверстия для установки упоров 4 (рис. 2). Нижняя траверса 3 имеет ножки 12 для установки на рабочей
    площадке (рис.1). 4.4. Упор 4 состоит из поворотной оси 13, в прямоугольных направляющих которой установлен ползун 14
    с цилиндрическим ручьем для упора изгибаемой трубы. На торцах ползунов закреплены ограничительные планки 15, которые ограничивают
    перемещение ползуна 14 в направляющих оси 13. Цапфы 16 поворотной оси упора устанавливаются в отверстия нижней 3 и верхней
    2 траверс трубогиба(рис.3). 4.5. Гибочные шаблоны трубогиба 5 выполнены методом стального точного литья. Гибочные шаблоны
    от 3/8" до 1,25" являются унифицированными для всех типоразмеров трубогибов. При комплектации ими трубогибов для гибки
    труб от 1,5" и выше, к ним прилагается переходная втулка (п.3.6). Кроме разделительных гибочных шаблонов трубогибы могут
    комплектоваться комбинированными гибочными шаблонами, изготавливаемыми из стального проката на станках с ЧПУ. Комбинированный
    шаблон имеет "ручьи" для труб 3/8", 1/2", 3/4",1".Конструкция комбинированного шаблона и раздельных 1,25", 1,5"; 2" выполнены
    с обнижением в ручье, что обеспечивает более качественную гибку. 4.6. Металлические транспортировочные ящики с полимерным
    покрытием для трубогиба и маслостанции предназначены для упаковки комплектующих частей трубогиба и гидравлической станции
    при хранении и транспортировке. https://www.instan.spb.ru/images/passport/bender-tpg2ep-1.jpg https://www.instan.spb.ru/images/passport/bender-tpg2ep.gif
    5. ПОДГОТОВКА ТРУБОГИБА К РАБОТЕ 5.1. Подготовьте гидростанцию к работе согласно Руководству по эксплуатации для гидростанции.
    5.2. Подсоедините рукав высокого давления 7 гидростанции 6 через быстроразъёмное соединение БРС к гидроцилиндру 1. 5.3.
    Включите педалью (пультом) подачу масла в гидроцилиндр 1. Если шток 11 гидроцилиндра 1 выдвигается с задержкой после включения
    гидростанции или рывками, значит в гидросистеме гидростанция-гидроцилиндр присутствует воздух. 5.4. Для удаления воздуха
    из гидросистемы трубогиба необходимо выполнить следующее: - выдвиньте шток гидроцилиндра на 80…100 мм и отключите педалью
    подачу масла в гидроцилиндр; - установите гидроцилиндр вертикально на шток, придерживая его рукой за задний корпус 8 (рис.4);
    - нажмите "клавишу" педали на "слив" масла из гидроцилиндра в бак гидростанции. При возвращении штока трубогиба в исходное
    положение с помощью возвратной пружины в гидроцилиндре воздух из гидросистемы вместе с маслом удаляется в бак гидростанции.
    5.5. Повторите п. 5.3. Если шток 11 гидроцилиндра 1 выдвигается без рывков и задержки после включения гидростанции, значит
    воздух удалён из гидросистемы. 5.6. Соберите трубогиб согласно схеме на рисунке 1, 2, обратив особое внимание на положение
    траверс 2 и 3 и вращающихся упоров 4, которые должны быть установлены симметрично оси гидроцилиндра в соответствующие
    отверстия согласно обозначениям на рис. 2. 5.7. Установите на шток 11 гибочный шаблон 5, комбинированный или раздельный,
    соответствующий диаметру изгибаемой трубы. 5.8. Смажьте цапфы 16 и прямоугольные направляющие упоров 4 консистентной смазкой.
    Ручей ползуна 16 должен оставаться несмазанным, чтобы исключить проскальзывание изгибаемой трубы относительно ползуна
    при гибке. Только при перемещении ползуна 14 вместе с трубой в направляющих упоров 4 при гибке обеспечивается качественная
    гибка трубы. 5.9. Ползуны 14 на поворотных осях 13 выставляются так, чтобы они располагались от оси гидроцилиндра в крайнем
    положении до упора в ограничительные планки 15 и имели свободу перемещения только к оси гидроцилиндра. 6. РАБОТА С ТРУБОГИБОМ
    6.1. Установите изгибаемую трубу между гибочным шаблоном 5 и упорами 4 (рис.1). 6.2. Перемещением штока 11 зажмите изгибаемую
    трубу между упорами 4 и гибочным шаблоном 5. Убедившись, что труба находится в "ручьях" шаблона и упоров, начинайте гибку.
    6.3. При гибке ползуны упоров скользят вместе с трубой по направляющим поворотных осей, что обеспечивает более качественную
    гибку и уменьшает усилие необходимое для гибки трубы на 10-15%. Следите, чтобы зазор между ограничительными планками 15
    ползунов и планками направляющих поворотной оси был не менее 2-х мм. В этом случае прекратите гибку, отведите шток от
    трубы на 5...10 мм и установите ползуны в исходное положение (п.5.8). Затем снова продолжайте гибку до требуемого угла.
    6.4. После завершения гибки отведите шток трубогиба в исходное положение, нажав соответствующую клавишу педали. 6.5. Снимите
    со штока гибочный шаблон с трубой. 6.6. Если трубу заклинило в "ручье" гибочного шаблона, снимите её, вбив клин в зазор
    между внутренней поверхностью "ручья" и трубой. 6.7. При гибке тонкостенных труб (когда отношение толщины стенки изгибаемой
    трубы к ее наружному диаметру менее 0,06) рекомендуется применять плотную набивку трубы сухим песком без примесей глиняных
    частиц. 6.8. Производить гибку с применением гибочных шаблонов, предназначенных для труб большего диаметра, необходимо
    с установкой между трубой и шаблоном пластины из мягкого алюминия или отожженной меди. При этом толщина пластины должна
    быть равна полуразности диаметров ручья гибочного шаблона и изгибаемой трубы. https://www.instan.spb.ru/komplekt/shablon.html
    7. ОБСЛУЖИВАНИЕ ГИДРАВЛИЧЕСКОГО ТРУБОГИБА 7.1. Обслуживание гидростанции – в руководстве по её эксплуатации. 7.2. Для
    удаления воздуха из гидросистемы трубогиба см. п. 5.4 данного руководства. 7.3. Для надежной работы изделия не допускайте
    попадания грязи, песка, ржавчины и др. частиц на шток гидроцилиндра. 8. ВОЗМОЖНЫЕ НЕИСПРАВНОСТИ И СПОСОБЫ ИХ УСТРАНЕНИЯ
    Неисправность Возможная причина Способы устранения Шток выдвигается с задержкой после включения станции или выдвигается
    рывком. Наличие воздуха в гидравлической системе. Удалить воздух из гидросистемы (см. п. 5.4). Гидроцилиндр не развивает
    необходимого усилия (меньше 550 бар). Неисправна гидравлическая маслостанция. Отремонтировать насосную станцию. 8.3. Указанные
    в п.8.1 неисправности не являются поводом для предъявления претензий к фирме-изготовителю и устраняются собственными силами
    без применения специального инструмента и оборудования. Если указанные методы устранения неисправностей не дают результата,
    необходимо обратиться в специализированную службу ремонта или на фирму изготовитель.'
