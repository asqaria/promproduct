  source_text: 'Опрессовочный насос ОГС-30 (опрессовщик) 1. НАЗНАЧЕНИЕ И ОСОБЕННОСТИ КОНСТРУКЦИИ Опрессовщик гидравлических
    систем модели ОГС-30 предназначен для опрессовки различных емкостей и систем трубопроводов при работе в условиях умеренного
    климата, исполнение У, категория I по ГОСТ 15150-69 в интервале температур окружающей среды 10-35 град. Его конструкция
    обеспечивает надежную работу в течение продолжительного времени, т.к. все детали его гидравлической системы изготовлены
    из нержавеющих материалов , а клапаны всасывания и нагнетания кроме того, защищены от попадания грязи при всасывании и
    сливе рабочей жидкости. Постоянство давления в испытываемой системе обеспечивается двумя клапанами и двумя вентилями с
    шаровыми головками. 2. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ 2.1. Максимальное давление опрессовки, МПа (Атм.)............3,0 (30)
    2.2. Производительность, мл./двойной ход............................25 2.3. Усилие на рычаге, кГс....................................................35
    2.4. Рабочая жидкость...............вода, машинное масло марки И-20А или И-30А по ГОСТ 20799-88 2.5. Емкость бака, л..............................................................8
    2.6. Присоединительный размер шланга (гайка накидная).....G3/8" 2.7. Габаритные размеры BхHхL, мм.....................................150х250х380
    2.8. Масса без рабочей жидкости, кг.....................................9 3. КОМПЛЕКТНОСТЬ 3.1. Насос в сборе, шт.........................................................1
    3.2. Бак, шт.........................................................................1 3.3. Манометр с верхним пределом
    измерений 4МПа, шт.....1 3.4. Рукав высокого давления, шт........................................1 3.5. Руководство по
    эксплуатации, шт..................................1 4. УСТРОЙСТВО ОПРЕССОВЩИКА 4.1. Опрессовщик состоит из насоса 1, который
    закреплён на полках в верхней части бака 2. К нагнетательной полости насоса 1 подсоединен рукав высокого давления 3. Второй
    конец рукава высокого давления предназначен для непосредственного подсоединения к испытываемой гидравлической системе
    через штуцер 13 (рис.3), установленный на входе в гидравлическую систему, если ответная часть штуцера имеет наружный диаметр
    G3/8", или через переходной ниппель 14 (рис.4), если ответная часть имеет наружный диаметр G1/2". 4.2. Насос 1 является
    рабочим органом опрессовщика и состоит из гидравлического цилиндра 4 с ручкой 5, установленного на плите 6, распределительной
    колодки 15, всасывающего и нагнетательного клапанов, а так же двух вентилей 7 и 8. Вентиль 7 служит для закрывания и открывания
    отверстия для слива, а запорный вентиль 8 для закрытия испытываемой гидравлической системы под давлением, а так же в открытом
    состоянии служит как нагнетательный клапан. Манометр 9 служит для контроля давления в испытываемой гидравлической системе.
    На конце всасывающего патрубка 10 цилиндра 4 находятся всасывающий клапан и сетчатый фильтр, который фиксируется гайкой
    11 и защищает всасывающий клапан от грязи. 4.3. Бак 2 служит для заливки рабочей жидкости (масла или воды). На верхней
    части бака закреплена плита 6 насоса 1. На противоположной торцевой стороне бака 2 имеется крючок 12 для фиксации ручки
    5 в нерабочем состоянии. Ручка 5 одновременно служит для переноса опрессовщика. 5. ПОДГОТОВКА НАСОСА К РАБОТЕ 5.1. Удалите
    воздух из гидросистемы насоса. 5.1.1. Проверьте подсоединение рукава 3 к насосу 1. 5.1.2. Заполните бак 2 рабочей жидкостью
    до верхней части всасывающего патрубка 10. 5.1.3. Закройте вентиль 7 и откройте вентиль 8 на 2-3 оборота. 5.1.4. Поднимите
    выходную часть рукава 13 и залейте в него жидкость. Для удаления воздуха из гидравлической системы насоса сделайте пробное
    закачивание воды, при этом воздух из гидросистемы будет выходить через рукав. 5.1.5. Когда выход воздуха через рукав закончится,
    опустите рукав в бак с жидкостью. 5.1.6. Сделайте пробное закачивание. При этом закачиваемая вода будет через рукав возвращаться
    в бак. 5.2. Подсоедините рукав 3 к испытываемой гидравлической системе, в которой должен быть установлен штуцер 13 с ответной
    частью для подсоединения рукава 3 (рис.3) или ниппель 14 (рис.4). Для уплотнения используются прокладки 16 из резины,
    отожженной меди или фторопласта. 5.3. Заполните испытываемую гидравлическую систему жидкостью, удалив из нее воздух. Плотно
    закройте все отверстия. 5.4. Произведите закачивание жидкости до достижения требуемого давления. 5.5. Закройте запорный
    вентиль 8 до окончания проведения испытаний. 5.6. После проведения испытаний медленно откройте вентиль 7 для сбрасывания
    давления, при этом жидкость будет поступать обратно в бак. Как только давление в гидросистеме упадёт, закройте вентиль
    соединяющий опрессовщик с гидросистемой, чтобы максимально исключить попадание в клапаны опрессовщика посторонних частиц
    при сливе. 5.7. Отсоедините рукав 3 от испытуемой системы. 6. ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ ОПРЕССОВЩИКА 6.1. Не допускайте
    загрязнения насоса и рабочей жидкости. 6.2. Периодически проверяйте и очищайте фильтр от грязи на всасывающем патрубке
    10. 6.3. После работы с водой: - Обязательно!!! Слейте воду из нагнетательной полости, открыв вентиль 8 и опустив шланг
    3 в бак 2, а затем из бака 2, наклонив его; - Залейте в бак машинного масла на 25-30мм выше нижнего края всасывающего
    патрубка 10; - Прокачайте насос 1 вхолостую для удаления воды из внутренних полостей насоса; - Хранить опрессовщик до
    следующих испытаний лучше, когда внутренние полости насоса заполнены маслом; - Перед следующими испытаниями водой, слейте
    масло из бака в емкость, т.к. в дальнейшем его можно будет многократно использовать. 6.4. Работать на опрессовочном насосе
    водой и оставлять его при температуре ниже 0°С не допускается! 7. ВОЗМОЖНЫЕ НЕИСПРАВНОСТИ И СПОСОБЫ ИХ УСТРАНЕНИЯ Неисправность
    Возможная причина Способ устранения 7.1.1. Насос на слив не работает (жидкость не засасывается) 7.2.1. Не работает всасывающий
    клапан 7.3.1. Удалите воздух из гидросистемы опрессовочного насоса: - закройте вентиль 7 и откройте вентиль 8; - залейте
    воду в бак до верхней части всасывающего патрубка 10; - залейте воду в напорную часть гидросистемы через шланг 3, подняв
    его вверх; - сделайте пробное закачивание воды в гидросистему насоса, при этом воздух из гидросистемы будет выходить через
    шланг; - при необходимости повторите 7.2.2. Засорился заборный фильтр 7.3.2. Отвернуть гайку 11 с сетчатым фильтром. Промыть
    фильтр и установить на всасывающий клапан 10 7.2.3. Износ манжеты гидроцилиндра 7.3.3. Заменить манжету 40x32 ГОСТ 14896-84
    7.1.2. Давление в гидросистеме опрессовщика не создаётся 7.2.4. Протечки в месте соединения шланга 3 и испытываемой гидравлической
    системой или в самой гидросистеме 7.3.4. Устранить протечки 8. МЕРЫ БЕЗОПАСНОСТИ 8.1. К работе с опрессовщиком допускаются
    лица, знающие правила эксплуатации оборудования с высоким давлением, изучившие настоящее руководство по эксплуатации и
    прошедшие инструктаж по технике безопасности. 8.2. Следите за надежным креплением элементов насоса и исправностью напорной
    линии. 8.3. Проверяйте и периодически очищайте фильтр. 8.4. Не производите ремонт опрессовщика и испытуемой гидравлической
    системы, находящихся под давлением. 8.5. Не работайте насосом с неисправным манометром, контролируйте давление системы
    и не поднимайте выше, указанного в руководстве по эксплуатации. 9. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА 9.1. Предприятие гарантирует
    исправность опрессовщика в течение 12 месяцев со дня его продажи. Гарантийные обязательства не распространяются на: -
    естественный износ резинотехнических изделий. - изделия с механическими повреждениями, вызванными перегрузкой и неправильной
    эксплуатацией. - изделия со следами самостоятельных ремонтных работ. 9.2. Претензии принимаются только при наличии настоящего
    паспорта с отметкой о дате продажи и штампом организации, продавшей опрессовщик.'
