  source_text: 'Наше предприятие производит гидравлические трубогибы ТПГ, ТГ с ручным и электрическим приводом, опрессовочные
    насосы ОГС и другой трубомонтажный инструмент. https://www.instan.spb.ru/images/products-superbig/press-pgg15ep.jpg https://www.instan.spb.ru/images/products-superbig/press-pgg15ep-mgs630.jpg
    Электрический пресс ПГГ-15ЭП ИНСТАН (усилие 15 тонн) 1. НАЗНАЧЕНИЕ Пресс гидравлический гаражный с электроприводом является
    профессиональным оборудованием предназначенным для запрессовки, выпрессовки, гибки и рихтовки деталей при различных ремонтных
    и сборочных работах. 2. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ ПРЕССА ПГГ-15ЭП 2.1 Наибольшее усилие гидроцилиндра, Тс 15 2.2 Наибольший
    ход штока, мм 250 2.3 Минимальное расстояние между столом и штоком, мм 60 2.4 Максимальная величина перемещения стола
    по высоте, мм 900 2.5 Величина шага перемещения стола по высоте, мм 90 2.6 Просвет между стойками рамы по ширине, мм 500
    2.7 Габаритные размеры (ширина / высота / глубина), мм: - в рабочем положении - при транспортировке 770х1690х540 730х1690х410
    2.8 Масса, кг 125 3. КОМПЛЕКТНОСТЬ 3.1 Рама в сборе, шт 1 3.2 Гидроцилиндр, шт 1 3.3 Гидравлическая насосная станция,
    шт 1 3.4 Балка-стол, шт 1 3.5 Штырь опорный, шт 2 3.6 Проставка, шт 1 3.7 Руководство по эксплуатации пресса, шт 1 3.8
    Руководство по эксплуатации маслостанции, шт 1 4. УСТРОЙСТВО 4.1. Электрический пресс состоит из рамы 1 в сборе, гидроцилиндра
    2, гидравлической насосной станции 3, балки-стола 4, двух опорных штырей 5 и проставки 6. 4.2. Рама 1 является базовой
    конструкцией, состоящей из сварных боковых стоек 7, поперечной балки 8, соединенной в верхней части боковых стоек болтами.
    В нижней части рамы пресса стойки 7 соединены двумя поперечными стяжками 9, а к боковым стенкам стоек прикреплены опорные
    уголки 10. К нижней площадке поперечной балки болтами через плиту 11 крепится гидроцилиндр 2. На боковой поверхности стойки
    7 закреплен кронштейн 16, на котором устанавливается гидравлическая насосная станция высокого давления 3. В боковых стойках
    7 имеются отверстия для установки опорных штырей 5, с помощью которых регулируется положение балки-стола 4 по высоте.
    4.3. Гидроцилиндр 2 является силовым устройством электрического пресса . Гидроцилиндр 2 соединен с насосной станцией 3
    шлангом 12 через быстроразъемное соединение 13. Выдвижной шток 14 гидроцилиндра 2 обеспечивает рабочее усилие 15Тс. В
    нижней части штока имеется "шейка" для установки проставки 6 (рис.2), удерживаемой на штоке резиновым кольцом 15. Проставка
    исключает прямое воздействие усилия непосредственно на шток гидроцилиндра и тем самым повреждение его рабочей поверхности.
    4.4. Гидравлическая насосная станция 3 обеспечивает работу гидроцилиндра 2. Руководство по эксплуатации станции является
    самостоятельным рабочим документом и входит в комплект поставки электрического пресса. 4.5. Балка-стол 4 выполнена в виде
    сварной конструкции, которая расположена между боковыми стойками 7. Вертикальные боковые стенки балки-стола охватывают
    боковые стойки и устанавливаются на штыри 5, которые имеют специальные фрезерованные площадки. Штыри соединяются с балкой-столом
    гибким элементом, чтобы исключить их потерю. Таблица для определения усилия гидроцилиндра по показаниям манометра. Давление
    МПа 6,1 12,2 18,3 24,4 30,5 36,6 42,7 48,8 54,9 61 Усилие Тс 1,5 3 4,5 6 7,5 9 10,5 12 13,5 15 5. ПОДГОТОВКА К РАБОТЕ
    5.1. Для приведения гидравлического пресса в рабочее положение после транспортировки присоедините опорные уголки 10 к
    стойкам 7. 5.2. Установите кронштейн 16. 5.3. Установите гидравлическую насосную станцию 3 на кронштейн 16. 5.4. Подсоедините
    насосную станцию 3 с помощью БРС 13 к гидроцилиндру. 5.5. Подготовьте маслостанцию к работе согласно п. 4 руководства
    по эксплуатации станции. 5.6. Проверьте совместную работу гидроцилиндра 2 пресса и маслостанции 3, выполнив последовательно
    все подпункты пункта 5 руководства по эксплуатации насосной станции. 5.7. Установите балку-стол 4 на требуемую высоту
    в зависимости от выполняемых работ. 5.8. Все работы проводите с использованием штоковой проставки 6, чтобы избежать повреждений
    рабочей поверхности штока. 5.9. Специальной оснасткой для различных видов работ пресс не комплектуется . 6. РАБОТА 6.1.
    Выполните последовательно операции согласно п. 5 руководства по эксплуатации насосной станции. 7. ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ
    7.1. Для надежной работы пресса не допускайте попадания грязи, песка, ржавчины на шток гидроцилиндра. 7.2. Обслуживание
    гидравлической насосной станции смотрите в руководстве по эксплуатации станции. 7.3. Для удаления воздуха из гидросистемы
    см. п. 5 руководства по эксплуатации насосной станции. 8. ВОЗМОЖНЫЕ НЕИСПРАВНОСТИ И СПОСОБЫ ИХ УСТРАНЕНИЯ Неисправность
    Возможная причина Способы устранения Шток выдвигается с задержкой после включения станции или выдвигается рывком Наличие
    воздуха в гидравлической системе Удалить воздух из гидросистемы (см. п.7) Гидроцилиндр не развивает необходимого усилия
    (давление меньше 63 МПа) Неисправна гидравлическая насосная станция Отремонтировать насосную станцию 9. МЕРЫ БЕЗОПАСНОСТИ
    9.1. Запрещается разбирать пресс , находящийся под нагрузкой. 9.2. Запрещается находиться во время работы пресса со стороны
    выхода штока 14. 9.3. Запрещается работать на прессе при деформированных несущих деталях. 9.4. Меры безопасности насосной
    станции изложены в п. 7 РЭ насосной станции. 10. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА 10.1. Предприятие гарантирует исправность и
    надежную работу электрического пресса и насосной станции в течение 12 месяцев со дня его продажи при условии соблюдения
    потребителем правил эксплуатации, изложенных в руководстве по эксплуатации пресса и насосной станции. 10.2. Претензии
    принимаются только при наличии настоящего руководства по эксплуатации с проставленным в нем заводским номером пресса,
    который выбит на передней гайке, а также с отметкой о дате продажи и штампом организации, продавшей пресс. 10.3. Гарантийные
    обязательства не распространяются на: - естественный износ резинотехнических изделий. - изделия с механическими повреждениями,
    вызванными перегрузкой и неправильной эксплуатацией. - изделия со следами самостоятельных ремонтных работ.'
