  source_text: 1. Назначение гидравлического съемника СГ-20Н Гидравлический съемник СГ-20Н с выносным насосом предназначен
    для демонтажа подшипников, зубчатых колес, ступиц, шкивов и других, установленных с натягом деталей с валов. 2. Технические
    характеристики съемника СГ-20Н с насосом НРГ 700-0.7 Характеристика Значение Максимальное осевое усилие 20т Минимальный
    диаметр захватываемой детали 100 мм Максимальный диаметр захватываемой детали 350 мм Максимальная глубина захвата 280
    мм Ход штока 70 мм Длина рукава высокого давления внешнего насоса съемника 1,8 м Рабочее давление съемника 630 бар Полный
    вес съемника в комплекте с внешним насосом в упаковке 26 кг Вес внешнего насоса съемника (с рукавом высокого давления)
    9,7 кг Размеры упаковки (деревянный ящик), мм 730х200х180 3. Устройство и схема сборки съемника 1. Съемная рукоятка 2.
    Основание рукоятки 3. Рукав высокого давления 4. Гидравлическое быстроразъемное соединение 5. Серьги для крепления лап
    6. Крепежные элементы 7. Лапы съемника 8. Основание для крепления лап 9. Гидроцилиндр с регулировочной резьбой 10. Шток
    11. Подпружиненный центрирующий конус 3.1. В лапах съемника 7 предусмотрены отверстия, для соединения с серьгами 5. В
    зависимости от комплектации лапы бывают либо с двумя отверстиями и захватом с одной стороны, либо одним отверстием и захватами
    с двух сторон. Гидравлический съемник СГ-20Н можно использовать как с тремя, так и с двумя лапами (захватами) . При использовании
    съемника с двумя захватами, лапы крепятся к диаметрально противоположным проушинам основания 8 с помощью серег 5. 3.2.
    На конце штока 10 находится жестко закрепленный или подпружиненный центрирующий конус 11 (зависит от модели и комплектации
    съемника ). Коническая насадка входит в центровочное отверстие вала. С её помощью шток съемника фиксируется относительно
    оси вала во время работы. 4. Подготовка съемника к работе 4.1. Перед работой проверьте все детали съемника на наличие
    повреждений. При обнаружении деформаций, трещин и признаков сильного износа на деталях съемника использование съемника
    запрещено. 4.2. Максимально точно оцените усилие, требуемое для снятия детали с вала . Если усилия съемника недостаточно
    для снятия детали – не используйте его, выберите модель съемника с подходящими характеристиками. 4.3. Рабочая температура
    съемника находится в интервале -5..+45 град. 5. Работа 5.1. Лапы съемника накидываются на снимаемую деталь. Гидроцилиндр
    съемника с регулировочной резьбой 9 ввинчивается в гайку с закрепленными на ней лапами, пока торец штока не упрется в
    вал со снимаемой деталью. Коническая насадка штока 11 должна встать в центровочное отверстие вала. 5.2. Заверните перепускной
    винт ручного насоса по часовой стрелке до упора. Приоткройте пробку заливного отверстия расположенного в задней части
    масляного бака насоса. 5.3. С помощью рукоятки 1, ввинченной в основание рукоятки 2 до упора, масло из бака насоса подается
    в гидроцилиндр 9, при этом шток съемника 10 упирается в торец вала и снимаемая деталь начинает перемещаться относительно
    вала. В процессе съема детали внимательно следите за положением рабочих площадок лап съемника относительно детали, чтобы
    избежать срыва лап с детали. В случае использования съемника с двумя лапами, следует особо внимательно следить за положением
    гидроцилиндра съемника относительно оси вала. Если съемник начинает уходить с оси вала (перекашивается), то необходимо
    прекратить работу и переустановить съемник. Используйте гидравлический съемник с двумя лапами только если захват детали
    тремя лапами невозможен. 5.4. Ход штока гидравлического съемника СГ-20Н составляет 70 мм и для снятия детали с вала может
    потребоваться более одного установа. Для этого следует повернуть перепускной винт против часовой стрелки. Под действием
    пружины шток съемника возвращается в исходное положение, освобождая снимаемую деталь из захватов . 6. Обслуживание съемника
    6.1. В процессе эксплуатации может потребоваться долить масло или полностью заменить его. Доливка масла осуществляется
    через заливное отверстие расположенное на задней части масляного бака насоса съемника . В качестве рабочей жидкости используется
    гидравлическое масло "ВМГЗ", "И-12А" или аналоги. 6.2. Не допускайте попадания воды на съемник своевременно смазывайте
    детали съемника . 7. Гарантийные обязательства 7.1. Поставщик гарантирует надежную работу съемника в течение 12 месяцев
    со дня его продажи при условии соблюдения потребителем правил эксплуатации, изложенных в настоящем РЭ. 7.2. Претензии
    принимаются только при наличии настоящего руководства по эксплуатации, а также с отметкой о дате продажи и штампом организации-продавца.
    7.3. Гарантийные обязательства не распространяются на съемники с механическими повреждениями, вызванными неправильной
    эксплуатацией, при наличии следов самостоятельных ремонтных работ, при отсутствии в баке масла или при наличии в баке
    масла отличного от рекомендуемого, при невыполнении п. 6 настоящего РЭ.
