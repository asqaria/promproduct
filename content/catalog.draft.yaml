  source_text: 'ТРОСОРЕЗЫ МАКС. ДИАМЕТР ТРОСА Тросорез гидравлический ТСРГ-30 30 мм Тросорез гидравлический ТСРГ-48 48 мм
    1. Назначение тросореза Тросорез ручной гидравлический стационарный со встроенным насосом предназначен для резки стальных
    тросов, медных и алюминиевых кабелей. 2. Технические характеристики тросореза ТСРГ Характеристика ТСРГ-30 ТСРГ-48 Максимальное
    осевое усилие 14 тонн 20 тонн Максимальный диаметр разрезаемого стального троса 30 мм 48 мм Максимальный диаметр разрезаемого
    медного или алюминиевого кабеля 30 мм 48 мм Ход штока 35 мм 53 мм Толщина подвижного лезвия 5 мм 8 мм Количество качков
    на полное выдвижение штока 80 60 Диапазон рабочих температур -10...+45 °С -10...+45 °С Полный вес тросореза в упаковке
    16.2 кг 32.1 кг Вес тросореза без упаковки 14.8 кг 32.1 кг Размеры упаковки (фанерный ящик), LxBxH 415х140х215 мм 535х185х260
    мм 3. УСТРОЙСТВО И ПРИНЦИП РАБОТЫ ТРОСОРЕЗА На литом основании 1 закреплены: гидроцилиндр со встроенным ручным насосом
    2, откидная скоба 9 с установленными неподвижными ножами. В рабочем положении скоба 9 фиксируется с помощью замка 6, который
    надевается на верхнюю силовую раму 4. Плунжерным насосом с помощью телескопической рукоятки 5, масло из масляного бака,
    закрытого пробкой 10, закачивается в рабочую полость гидроцилиндра. Шток, с установленным на нем подвижным ножом 7, выдвигается
    и производит рез троса. При повороте винта 3 против часовой стрелки, открывается клапан сброса давления, и шток гидроцилиндра
    возвращается в исходное положение с помощью встроенной пружины. Тросорез ручной гидравлический стационарный ТСРГ-30 (до
    30мм) 4. ПОДГОТОВКА К РАБОТЕ Перед работой проверьте детали тросореза на отсутствие повреждений. При обнаружении деформаций,
    трещин и признаков сильного износа на деталях, использование тросореза запрещено. Рабочая температура инструмента находится
    в интервале -10..+45 град. Убедитесь, что используемое гидравлическое масло соответствует температуре окружающей среды
    в месте проведения работы. Если величина выдвижения штока за один качок рукоятки уменьшилась, попробуйте заменить масло
    на морозостойкое (с меньшей вязкостью). Если без нагрузки шток не выдвигается до конца, долейте масло через заливное отверстие
    закрытое резиновой пробкой 10. 5. РАБОТА 5.1. Отведите замок-фиксатор 6 и откиньте скобу 9 с неподвижными ножами. 5.2.
    Поместите отрезаемый трос в рабочем пространстве скобы 9. 5.3. Поднимите скобу 9 вместе с тросом в исходное положение
    и заведите замок 6 за упор силовой рамы 4. 5.4. Заверните перепускной винт 3 до упора. 5.5. С помощью рукоятки 5 масло
    из бака нагнетается в гидроцилиндр, при этом шток с ножом 7 начинает перемещаться. Подвижный нож проходит между двумя
    неподвижными С-образными ножами, разрезая трос. 5.6. После завершения реза, поверните перепускной винт 3 против часовой
    стрелки. Масло из рабочей полости гидроцилиндра вернется в масляный бак, а шток с ножом вернется в исходное положение.
    6. ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ ТРОСОРЕЗА 6.1. В процессе эксплуатации может потребоваться долить масло или полностью заменить
    его. Доливка масла в бак осуществляется через заливное отверстие закрытое резиновой пробкой 10. В качестве рабочей жидкости
    используется гидравлическое масло "ВМГЗ", "И-12", "И-20" или аналоги. 6.2. Не допускайте попадания воды на тросорез, своевременно
    смазывайте подвижные детали.'
