  source_text: 'Наше предприятие производит гидравлические трубогибы ТПГ, ТГ с ручным и электрическим приводом, опрессовочные
    насосы ОГС и другой трубомонтажный инструмент. Трубогиб электрический гидравлический ТГ-3ЭП 1. НАЗНАЧЕНИЕ ТРУБОГИБА Трубогиб
    гидравлический с электроприводом является профессиональным оборудованием и предназначен для гибки газо-водопроводных труб
    по ГОСТ 3262-75, а также проката круглого сечения, прочностные характеристики которого не превышают характеристик трубы
    3" (условный проход 80 мм ). 2. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ 1 Наибольшее усилие гидроцилиндра, Тс 15 2 Наибольший ход штока,
    мм 250 3 Скорость выдвижения штока, мм/мин 330 4 Габаритные размеры транспортировочных ящиков трубогиба BхHхL, мм 180х680х920
    225х285х485 5 Габаритные размеры транспортировочного ящика насосной станции BхHхL, мм 320х480х500 6 Параметры раздельных
    гибочных шаблонов, dтр/R гибки, дюйм/мм 3/8"/50, 1/2"/65, 3/4"/80, 1"/100, 1,25”/135, 1,5"/150, 2"/200, 2,5"/260, 3"/300
    7 Параметры комбинированного гибочного шаблона, dтр/R гибки, дюйм/мм 3/8"/72, 1/2"/77, 3/4"/82, 1"/89 8 Количество гибочных
    шаблонов (в комплектации): - С раздельными гибочными шаблонами, шт - С комбинированным и раздельными гибочными шаблонами,
    шт 9 6 9 Масса трубогиба, кг 150 3. КОМПЛЕКТНОСТЬ ТРУБОГИБА 1 Гидроцилиндр в сборе, шт 1 2 Основание, шт 1 3 Гибочные
    шаблоны: 3.1 Комплектация с раздельными шаблонами, шт 9 3.2 Комплектация с комбинированным шаблоном, шт 6 4 Ящик транспортировочный
    для гидроцилиндра в сборе, шт 1 5 Ящик транспортировочный для гибочных шаблонов, шт 1 6 Гидравлическая насосная станция,
    шт 1 7 Ящик транспортировочный для насосной станции, шт 1 8 Втулка переходная, шт 1 9 Руководство по эксплуатации трубогиба,
    шт 1 10 Руководство по эксплуатации маслостанции, шт 1 4. УСТРОЙСТВО ТРУБОГИБА ТГ-3ЭП 4.1. Трубогиб состоит из гидроцилиндра
    в сборе 1, основания 2, комплекта гибочных шаблонов 3 и гидравлической насосной станции 4. 4.2. Гидроцилиндр в сборе 1
    состоит из собственно гидроцилиндра 5, двух траверс верхней 6 и нижней 7, а также двух упоров 8. 4.2.1. Гидроцилиндр 5
    является силовым органом трубогиба . На торце заднего корпуса 9 гидроцилиндра 5 имеется штуцер 10 с быстроразъемным соединением
    БРС, через которое гидроцилиндр 5 соединяется через рукав высокого давления 11 с гидравлической насосной станцией 4. Передний
    корпус 12 гидроцилиндра 5 соединен с верхней 6 и нижней 7 траверсами. Верхняя и нижняя траверсы соединены также между
    собой стойками 13. Гидроцилиндр с траверсами представляют жесткую силовую конструкцию, которая крепится к основанию 2
    трубогиба. 4.2.2. Верхняя и нижняя траверсы снабжены отверстиями, в которые устанавливаются упоры симметрично относительно
    оси гидроцилиндра . Каждая пара отверстий соответствует определенному диаметру трубы от 1/2" до 3". 4.2.3. Упор 8 состоит
    из поворотного корпуса 14, в прямоугольных направляющих которого установлен ползун 15 с цилиндрическим ручьем для упора
    изгибаемой трубы. На торцах ползунов закреплены ограничительные планки 16, которые ограничивают перемещение ползуна 15
    в направляющих поворотного корпуса 14. В отверстие поворотного корпуса 14 вставляется штырь 17, который вставляется в
    отверстия верхней и нижней траверс. При перестановки упоров в отверстия, соответствующие диаметру изгибаемой трубы, необходимо
    вынуть штырь, переставить поворотный корпус с ползуном, и вставить штырь в отверстия траверс. 4.3. Основание 2 представляет
    собой сварной каркас из уголка, на верхней площадке которого закреплен четырьмя болтами за нижнюю траверсу гидроцилиндр
    в сборе 1, а на нижней площадке 18 основания 2 крепится гидравлическая насосная станция 4. Для перемещения трубогиба вручную
    предусмотрены два ролика 19 в передней части основания и две ручки 20 сзади основания. При транспортировке основания автомобильным
    и железнодорожным транспортом ручки разворачиваются и крепятся так, чтобы они не выходили за габариты основания. 5. ПОДГОТОВКА
    ТРУБОГИБА ТГ-3ЭП К РАБОТЕ 5.1. При транспортировке автомобильным и железнодорожным транспортом используются три транспортировочных
    ящика для: - гидроцилиндра в сборе, - гидравлической насосной станции, - гибочных шаблонов. Основание трубогиба транспортируется
    без твердой упаковки. 5.2. Распакуйте основание 2. 5.3. Выньте из транспортировочных ящиков гидроцилиндр в сборе 1 и гидравлическую
    насосную станцию 4. 5.4. Закрепите четырьмя болтами на верхней площадке основания 2 гидроцилиндр в сборе 1. 5.5. Установите
    на нижней площадке основания 2 гидравлическую насосную станцию 4 и закрепите ее четырьмя болтами. 5.6. Подсоедините насосную
    станцию через быстроразъемное соединение 10 к гидроцилиндру 5. 5.7. Подключите гидравлическую насосную станцию к сети
    электропитания 220...230В, 50Гц. 5.8. Включите педалью управления подачу масла в гидроцилиндр 5. Если шток 22 гидроцилиндра
    5 выдвигается с задержкой после включения гидростанции или рывками значит в гидросистеме "гидростанция – гидроцилиндр"
    присутствует воздух. 5.9. Для удаления воздуха из гидросистемы трубогиба выдвиньте шток 22 на 150...200 мм и отключите
    педалью подачу масла в гидроцилиндр. Затем нажмите клавишу педали на слив масла из гидроцилиндра. Воздух вместе с маслом
    должен выйти в бак насосной станции. Если частично воздух остался в гидросистеме, повторите эту операцию до тех пор, когда
    при включении насосной станции на подачу масла в гидроцилиндр шток выдвигается без задержки. 5.10. Установите на штоке
    22 трубогиба гибочный шаблон , соответствующий диаметру изгибаемой трубы . 5.11. Смажьте штыри 17 и прямоугольные направляющие
    8 консистентной смазкой. "Ручей" (прилегающая к трубе часть) ползуна 15 должен оставаться несмазанным, чтобы исключить
    проскальзывание изгибаемой трубы относительно ползуна при гибке. 5.12. Ползуны 15 на поворотных упорах 8 выставьте так,
    чтобы они располагались в крайнем положении от оси гидроцилиндра до упора в ограничительные планки 16 и имели свободу
    перемещения в направлении к оси гидроцилиндра. 5.13. Установите изгибаемую трубу между гибочным шаблоном 3 и упорами 8.
    5.14. Перемещением штока 22 зажмите изгибаемую трубу между упорами 8 и гибочным шаблоном 3. Убедитесь, что труба находится
    в "ручьях" шаблона и ползунов 15 упоров 8. 6. РАБОТА 6.1. Выполнив все пункты по подготовке трубогиба к работе , начните
    гибку подачей масла в гидроцилиндр. 6.2. При гибке ползуны 15 упоров скользят вместе с трубой по направляющим упоров ,
    что обеспечивает более качественную гибку и уменьшает усилие необходимое для гибки трубы на 10-15%. Следите, чтобы зазор
    между ограничительными планками 16 ползунов и планками 23 направляющих поворотного корпуса 14 был не менее 2-х мм. В этом
    случае прекратите гибку, отведите шток от трубы на 5...10 мм и установите ползуны в исходное положение (п.5.12). Затем
    снова продолжайте гибку до требуемого угла. 6.3. После завершения гибки отведите шток в исходное положение, нажав соответствующую
    клавишу педали. 6.4. Снимите со штока гибочный шаблон с трубой . 6.5. Если трубу заклинило в "ручье" гибочного шаблона,
    снимите её, вбив клин в зазор между внутренней поверхностью "ручья" и трубой. 6.6. При гибке тонкостенных труб (когда
    отношение толщины стенки изгибаемой трубы к ее наружному диаметру менее 0,06) рекомендуется применять плотную набивку
    трубы сухим песком без примесей глиняных частиц. 6.7. Производить гибку с применением гибочных шаблонов, предназначенных
    для труб большего диаметра, необходимо с установкой между трубой и шаблоном пластины из мягкого алюминия или отожженной
    меди. При этом толщина пластины должна быть равна полуразности диаметров ручья гибочного шаблона и изгибаемой трубы. 7.
    ОБСЛУЖИВАНИЕ ТРУБОГИБА ТГ-3ЭП 7.1. Обслуживание гидравлической насосной станции – в руководстве по её эксплуатации. 7.2.
    Для удаления воздуха из гидросистемы см. п. 5.9 данного руководства. 7.3. Для надежной работы трубогиба не допускайте
    попадания грязи, песка, ржавчины и др. частиц на шток гидроцилиндра. 8. ВОЗМОЖНЫЕ НЕИСПРАВНОСТИ ТРУБОГИБА И СПОСОБЫ ИХ
    УСТРАНЕНИЯ Неисправность Возможная причина Способы устранения 8.1. Шток выдвигается с задержкой после включения станции
    или выдвигается рывком Наличие воздуха в гидравлической системе. Удалить воздух из гидросистемы (см. п. 5.9) 8.2. Гидроцилиндр
    не развивает необходимого усилия (меньше 55МПа). Неисправна гидравлическая насосная станция. Отремонтировать насосную
    станцию (п.6 руководства по эксплуатации насосной станции). 9. МЕРЫ БЕЗОПАСНОСТИ ПРИ РАБОТЕ С ТРУБОГИБОМ 9.1. Запрещается
    разбирать и ремонтировать трубогиб, находящийся под нагрузкой. 9.2. Запрещается находиться во время гибки трубы со стороны
    выхода штока 22. 9.3. Запрещается работать на трубогибе при деформированных несущих деталях. 10. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА
    10.1. Предприятие гарантирует исправность трубогиба в течение 12 месяцев со дня его продажи при условии соблюдения потребителем
    правил эксплуатации. 10.2. Претензии принимаются только при наличии настоящего руководства по эксплуатации с проставленным
    в нем заводским номером гидроцилиндра, который выбит на передней гайке, а также с отметкой о дате продажи и штампом организации,
    продавшей трубогиб . 10.3. Гарантийные обязательства не распространяются на: - естественный износ резинотехнических изделий.
    - изделия с механическими повреждениями, вызванными перегрузкой и неправильной эксплуатацией. - изделия со следами самостоятельных
    ремонтных работ.'
