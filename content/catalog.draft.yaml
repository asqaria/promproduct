        5мм 1. НАЗНАЧЕНИЕ ГИДРАВЛИЧЕСКОГО ДОМКРАТА С НИЗКИМ ПОДХВАТОМ Домкрат гидравлический грузовой с низким подхватом предназначен
        для подъема груза, для установочно-монтажных работ. В качестве привода домкратов ДА5-120ПН, ДА10-150ПН, ДА20-160ПН,
        ДА30-160ПН используется встроенный ручной насос. В качестве привода домкрата ДГ8-90ПН используется выносной ручной,
        ножной или электрический насос (насос в комплект не входит). 2. ПОДГОТОВКА К РАБОТЕ И РАБОТА ДОМКРАТА Поставьте домкрат
        на ровную горизонтальную поверхность. Проверьте работоспособность домкрата без нагрузки: С помощью встроенного или
        внешнего (для ДГ8-90ПН) насоса закачайте масло в гидроцилиндр. Остановите насос, когда шток домкрата полностью выдвинется.
        Рукояткой насоса откройте перепускной винт для сброса давления. Поршень домкрата с помощью пружин вернется в исходное
        положение вытеснив в бак насоса гидравлическое масло. Установите домкрат под груз на ровную горизонтальную поверхность
        штоком вверх. Домкрат готов к работе. Домкраты со встроенным насосом ДА5-120ПН, ДА10-150ПН, ДА20-160ПН, ДА30-160ПН
        можно использовать только в положении "штоком вверх". Домкрат с выносным насосом ДГ8-90ПН можно использовать в любом
        пространственном положении. Но насос, подключенный к домкрату с помощью рукава высокого давления, должен находится
        в рабочем положении в соответствии с руководством по эксплуатации насоса.'
