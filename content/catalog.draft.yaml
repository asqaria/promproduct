  source_text: 'Наше предприятие производит гидравлические трубогибы ТПГ, ТГ с ручным и электрическим приводом, опрессовочные
    насосы ОГС и другой трубомонтажный инструмент. Труборез ручной роликовый ТР-2 1. НАЗНАЧЕНИЕ И ОБЛАСТЬ ПРИМЕНЕНИЯ Труборез
    предназначен для поперечной резки вручную труб с толщиной стенки до 5 мм из незакаленных черных и цветных металлов (кроме
    нержавеющих и жаропрочных сталей и сплавов). 2. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ 2.1. Диаметр отрезаемой трубы, мм - максимальный.......60
    - минимальный.........9 2.2. Габаритные размеры B x H x L, мм......50x140x340 2.3. Масса, кг.........2,3 3. КОМПЛЕКТНОСТЬ
    3.1. Труборез ручной, шт.........................1 3.2. Руководство по эксплуатации, шт.....1 4. УСТРОЙСТВО ТРУБОРЕЗА
    Труборез состоит из скобы 1, по прямоугольным направляющим которой перемещается каретка 2 с двумя направляющими роликами
    3, установленными на осях 4 с возможностью свободного вращения. Оси 4 зафиксированы планкой 5. В «кармане» выступа скобы
    на оси 6 установлен со свободой вращения дисковый нож 7. Ось 6 зафиксирована на скобе планкой 8. Каретка 2 перемещается
    по направляющим скобы 1 при вращении винтовой ручки 9. 5. РАБОТА Перед работой трубореза необходимо смазать минеральным
    маслом резьбу на винтовой ручке 9, оси 4 и 6, нож 7, а также очищенную поверхность трубы в зоне резания. Для отрезания
    трубы необходимо зажать со средним усилием от руки трубу между ножом 7 и роликами 3, так чтобы образовался след глубиной
    0,1-0,2 мм, а затем сделать полный оборот трубореза вокруг трубы, следя за тем, чтобы конец следа от ножа совпал с его
    началом. Затем, постепенно увеличивая с помощью ручки 9 врезание ножа в трубу, вращать труборез вокруг трубы до полного
    отрезания (примерно 12...15 оборотов для трубы 3/4”). Примечание: из-за чрезмерного усилия зажима при первом обороте возможно
    образование следа от ножа в виде винтовой линии. Во избежание поломки ножа в этом случае рекомендуется начать новый рез
    чуть в стороне, а не исправлять получившуюся винтовую линию за счет приложения дополнительных осевых усилий. 6. УКАЗАНИЯ
    ПО ЭКСПЛУАТАЦИИ При необходимости расконсервацию трубореза производить путем снятия антикоррозийной смазки с помощью растворителя
    (бензина, керосина, уайт-спирита). После работы, а также периодически, один раз в месяц, необходимо производить смазку
    открытых поверхностей тонким слоем консистентной смазки (например солидолом ГОСТ 4366-76 ). Примечания: - при необходимости
    разборки трубореза оси ножа 7 и роликов 3 извлекаются после удаления винтов, закрепляющих фиксирующие пластинки 8 и 5;
    - в процессе эксплуатации допускаются неоднократные переточки ножа до диаметра 24 мм; при этом необходимо обеспечить симметричность
    режущей кромки и угол при ее вершине 60град. 7. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА 7.1. Предприятие гарантирует исправность и работоспособность
    трубореза в течение 12 месяцев со дня продажи при условии соблюдения потребителем правил эксплуатации и целевого использования.
    7.2. Данная гарантия не распространяется на повреждения вызванные перегрузкой или неправильной эксплуатацией, а также
    на естественный износ режущего инструмента. Гарантия на нож не распространяется. 7.3. Претензии принимаются только при
    наличии настоящего руководства по эксплуатации с отметкой о дате продажи и штампом организации, продавшей труборез.'
  source_tables:
