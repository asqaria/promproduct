  source_text: 'Наше предприятие производит гидравлические трубогибы ТПГ, ТГ с ручным и электрическим приводом, опрессовочные
    насосы ОГС и другой трубомонтажный инструмент. Трубогиб ручной ТР-1 Трубогиб ручной ТР-1 предназначен для гибки водопроводных
    и газовых труб 15, 20, 25 мм (наружный диаметр трубы 22мм, 28мм, 34мм) на угол от 0 до 180 градусов, а также арматуры.
    Трубогиб применяется в мастерских и на строительных площадках. Трубогиб ручной ТР-1 имеет простую и надежную конструкцию:
    упор, гибочный шаблон и рычаг. Технические характеристики: Угол загиба от 0 до 180 градусов Параметры гибочных шаблонов:
    условный проход труб 15мм, 20мм, 25мм (1/2"; 3/4"; 1") (наружный диаметр трубы 22мм, 28мм, 34мм) Особенности работы: При
    необходимости гибочный рычаг трубогиба удлиняется обрезком трубы Для работы трубогиб установить на горизонтальную поверхность
    и закрепить тремя болтами М12'
