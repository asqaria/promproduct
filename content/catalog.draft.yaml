    - - 8.2.4. Вместе с водой в гидравлическую систему насоса попало большое количество воздуха.
      - 8.3.5. Поместите накопительный бак 24 под краном водопровода и заполните его водой. Опустите заборный шланг 15 в бак
        с водой. Бак поместите на одном уровне с опрессовщиком.
    - - 8.2.5. Водный фильтр засорился.
      - 8.3.6. Очистить фильтр.
    - - 8.2.6. Вентиль 17 находится в положении соответствующем минимальному давлению
      - 8.3.7. Открыть вентиль 17, чтобы достичь требуемого давления.
    - - 8.2.7. Прокладки изношены, вентили не закрываются полностью.
      - 8.3.8. Обратитесь в сервисный центр.
    - - 8.1.5. Непостоянное давление на выходе и сильный шум.
      - 8.2.8. В устройство попал воздух.
      - 8.3.9. Проверьте заборный шланг для воды и плотность соединения его с обоих концов.
    - - 8.2.9. Насос подает недостаточное количество воды.
    - - 8.1.6. Насос создает требуемое давление, но не поддерживает его.
      - 8.2.10. Клапан вентиля давления 17 функционирует неправильно.
      - 8.3.10. Проверьте клапан, удалите грязь, которая могла попасть в клапан.
