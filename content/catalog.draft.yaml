  source_text: 'Шиногибы Ширина шины Толщина шины Шиногиб гидравлический ШГГ-150Н 150 мм 10 мм Шиногиб гидравлический ШГГ-200Н
    200 мм 12 мм Шиногиб на ребро ШГГ-125Н-Р 125 мм 12 мм Модель Усилие гидроцилиндра Максимальная ширина шины Максимальная
    толщина шины Вес Шиногибы с внешним насосом Шиногиб ШГГ-150Н 16т 150 мм 10 мм 19 кг Шиногиб ШГГ-200Н 20т 200 мм 12 мм
    28 кг 1. НАЗНАЧЕНИЕ ШИНОГИБА ШГГ-150Н Шиногиб гидравлический ШГГ-150Н предназначен для гибки токопроводящих медных и алюминиевых
    шин, а также стальных полос, пластин. Шиногиб оснащен откидной рамой для быстрого извлечения электротехнической шины после
    гибки, откидная рама также позволяет работать с шинами сложной формы. В основании гидравлического шиногиба ШГГ-150Н выполнены
    четыре отверстия для закрепления на рабочем месте в горизонтальном или вертикальном положении. На направляющих шиногиба
    нанесена лазерная разметка углов гиба шины / полосы . У шиногиба есть подвижный упор для настройки его под работу с шинами
    определенной ширины. В верхней части шиногиба установлена откидная рукоятка для переноса. Важно: Шиногибы ШГГ-125Н-Р,
    ШГГ-150Н и ШГГ-200Н поставляются без гидравлического насоса! В качестве привода шиногиба можно использовать ручной гидравлический
    насос с давлением до 70 МПа или электрические маслостанции одностороннего действия с ручным или электромагнитным управлением.
    2. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ ШИНОГИБОВ Шиногиб гидравлический ШГГ-150Н с внешним насосом (насос в комплект не входит)
    1. Усилие гидроцилиндра шиногиба: 16 тонн 2. Максимальная ширина шины без упора: 150 мм 3. Максимальная ширина шины с
    использованием упора: 130 мм 4. Величина перемещения упора: 44 мм 5. Максимальная толщина шины: 10 мм 6. Максимальный
    угол гиба: 90 градусов 7. Возврат штока: пружинный 8. Рабочее давление: 630 бар (63 МПа) 9. Длина / Ширина / Высота: 360мм
    / 160мм / 255мм-300мм 10. Размеры основания шиногиба: 205мм х 100мм 11. Максимальный просвет между матрицами: 42мм 12.
    Максимальный просвет по высоте: 155мм 13. Вес в упаковке: 19.1кг 14. Используемое масло: И-8А, И-12А, И-20А, ВМГЗ 15.
    Резьба подключения насоса: коническая 3/8" Шиногиб гидравлический ШГГ-200Н с внешним насосом (насос в комплект не входит)
    1. Усилие гидроцилиндра шиногиба: 20 тонн 2. Максимальная ширина шины: 200 мм 3. Максимальная толщина шины: 12 мм 4. Максимальный
    угол гиба: 90 градусов 5. Возврат штока: пружинный 6. Рабочее давление: 630 бар (63 МПа) 7. Длина / Ширина / Высота: 245мм
    / 175мм / 355мм 8. Размеры основания шиногиба: 225мм х 120мм 9. Максимальный просвет между гибочными матрицами: 32мм 10.
    Максимальный просвет по ширине между стойками: 202мм 11. Вес в упаковке: 27.6кг 12. Используемое масло: И-8А, И-12А, И-20А,
    ВМГЗ 13. Резьба подключения насоса: коническая 3/8" Шиногиб "на ребро" ШГГ-125Н-Р с внешним насосом (насос в комплект
    не входит) 1. Усилие гидроцилиндра шиногиба: 25 тонн 2. Максимальная ширина шины: 125 мм 3. Максимальная толщина шины:
    12,5 мм (в комплекте 6 вкладышей: 4, 5, 6, 8, 10, 12мм) 4. Максимальный угол гиба: 90 градусов 5. Возврат штока: пружинный
    6. Рабочее давление: 630 бар (63 МПа) 7. Длина / Ширина / Высота: 390мм / 270мм / 150мм 8. Вес в упаковке: 93 кг 9. Используемое
    масло: И-8А, И-12А, И-20А, ВМГЗ 10. Резьба подключения насоса: коническая 3/8" Размеры рабочего пространства шиногиба
    3.1. УСТРОЙСТВО ГИДРАВЛИЧЕСКОГО ШИНОГИБА ШГГ-150Н Шиногиб состоит из основания с откидной рамой, гидроцилиндра с гибочным
    шаблоном и упором для настройки ширины шины. Гидроцилиндр одностороннего действия с пружинным возвратом штока может работать
    совместно с гидравлическим насосом с давлением до 700бар. С шиногибом возможно использовать гидравлический насос или маслостанцию
    одностороннего действия с давлением до 70 МПа. 3.2. УСТРОЙСТВО ГИДРАВЛИЧЕСКОГО ШИНОГИБА ШГГ-200Н Гидравлический шиногиб
    состоит из жестко закрепленного основания, гидроцилиндра с гибочным шаблоном установленным на штоке. Гидроцилиндр одностороннего
    действия с пружинным возвратом штока может работать совместно с гидравлическим насосом с давлением до 700бар. С шиногибом
    возможно использовать ручной гидравлический насос или маслостанцию одинарного действия с давлением до 70 МПа. 4.1. ПРИНЦИП
    РАБОТЫ С ШИНОГИБОМ ШГГ-150Н Подключите рукав высокого давления с БРС к шиногибу и к гидравлическому насосу / маслостанции.
    Если ответная часть БРС на шиногибе не соответствует БРС на РВД ручного насоса или маслостанции, то потребуется ее заменить.
    Проверьте работу шиногиба на холостом ходу, затем сбросьте давление в системе. После возврата штока отрегулируйте упор
    по вертикали так, чтобы изгибаемая шина / полоса / пластина находилась по центру рабочего пространства максимально близко
    к оси штока цилиндра, для избежания перекоса гибочного шаблона. Если ширина изгибаемой шины больше 130 мм, то следует
    убрать упор выкрутив винты с обеих сторон гибочного шаблона. Произведите гиб шины на требуемый угол, сбросьте давление
    в системе. 4.2. ПРИНЦИП РАБОТЫ С ШИНОГИБОМ ШГГ-200Н Подключите рукав высокого давления с БРС к шиногибу и к ручному гидравлическому
    насосу или электрической маслостанции. Если ответная часть БРС на шиногибе не соответствует БРС на ручном насосе или маслостанции,
    то потребуется ее заменить. Проверьте работу шиногиба на холостом ходу, затем сбросьте давление в системе. После возврата
    штока установите шину в рабочую зону шиногиба . Шину / полосу / пластину следует размещать по центру рабочего пространства
    максимально близко к оси штока цилиндра, чтобы избежать перекоса гибочного шаблона. Произведите гиб шины на требуемый
    угол, сбросьте давление в системе. 5. ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА Поставщик гарантирует надежную работу шиногиба в течение
    12 месяцев со дня его продажи при условии соблюдения потребителем правил эксплуатации, изложенных в настоящем РЭ. Претензии
    принимаются только при наличии настоящего руководства по эксплуатации, а также с отметкой о дате продажи и штампом организации-продавца.
    Гарантийные обязательства не распространяются на оборудование с механическими повреждениями, вызванными неправильной эксплуатацией
    и при наличии следов самостоятельных ремонтных работ.'
